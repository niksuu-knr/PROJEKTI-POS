<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-RAUTA POS v36.1 PRO</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1; --danger: #cc0000; --success: #28a745; --terminal-green: #0f0; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: var(--k-blue); color: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 4px solid var(--k-orange); }
        header.return-mode { background: var(--danger); }
        
        .main-container { display: flex; flex: 1; gap: 8px; padding: 8px; height: calc(100vh - 68px); }
        .left-panel { width: 480px; display: flex; flex-direction: column; gap: 8px; }
        .receipt-area { flex: 1; background: white; border: 2px solid #666; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 15px; font-size: 1.1rem; }
        .receipt-row { padding: 8px 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer; }
        .receipt-row.selected { background: var(--k-blue) !important; color: white; }
        
        .total-container { background: #eee; border-top: 3px solid #999; padding: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 2.8rem; font-weight: bold; color: var(--k-blue); }

        .input-display { background: #000; color: var(--terminal-green); padding: 10px 20px; text-align: right; font-size: 3.2rem; font-family: 'Courier New', monospace; border: 5px inset #444; min-height: 85px; line-height: 1.2; }

        /* NUMPADIN ALKUPERÄINEN KOKO JA TYYLI */
        .numpad-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex-shrink: 0; }
        .num-btn { height: 75px; background: #fdfdfd; border: 2px solid #777; font-size: 1.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-btn:active { background: #bbb; }
        .num-btn.action { background: #eee; color: var(--k-blue); }

        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
        .product-display { flex: 1; background: #bbb; border: 2px solid #888; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows: 110px; gap: 10px; overflow-y: auto; }
        .category-bar { height: 80px; background: #999; display: flex; gap: 5px; padding: 5px; overflow-x: auto; border-top: 2px solid #777; flex-shrink: 0; }
        
        .grid-item { background: white; border: 1px solid #666; border-bottom: 5px solid var(--k-blue); font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5px; }
        .cat-item { min-width: 130px; background: var(--k-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border: 1px solid #333; flex-shrink: 0; }
        .cat-item.active { background: var(--k-orange); }

        .right-panel { width: 170px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #fdfdfd; border: 2px solid #777; font-size: 0.85rem; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 1.2rem; }
        .f-btn.pay { background: var(--success); color: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 500px; padding: 30px; border: 10px solid var(--k-blue); border-radius: 8px; }
        
        .login-screen { position: fixed; inset: 0; background: var(--k-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body onload="init()">

<div id="login-screen" class="login-screen">
    <div style="font-size: 5rem; font-weight: 900;">K-RAUTA</div>
    <div id="login-display" style="background:white; color:black; padding:20px 80px; font-size:4rem; margin:20px; font-family:monospace; border:8px solid var(--k-orange);">****</div>
    <p style="font-size: 1.2rem;">SYÖTÄ MYYJÄNUMERO (1234)</p>
</div>

<header id="main-header">
    <div id="h-receipt">KUITTI: #10001</div>
    <div id="h-mode">MYYNTI</div>
    <div id="h-seller">MYYJÄ: -</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-container">
                <div class="total-row"><span>YHTEENSÄ</span><span id="total-display">0.00</span></div>
            </div>
        </div>
        <div class="input-display" id="pos-input-display">0.00</div>
        <!-- NUMPAD ALKUPERÄINEN KOKO -->
        <div class="numpad-container" id="numpad-ui"></div>
    </div>

    <div class="center-panel">
        <div class="product-display" id="product-grid"></div>
        <div class="category-bar" id="category-grid"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="logout()"><span>F1</span>ULOS</div>
        <div class="f-btn" onclick="alert('Admin: F2')"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="searchMember()"><span>F3</span>HAE JÄSEN</div>
        <div class="f-btn" onclick="applyDiscount()"><span>F5</span>ALE %</div>
        <div class="f-btn" onclick="removeItem()"><span>F6</span>POISTA</div>
        <div class="f-btn" onclick="toggleReturn()"><span>F7</span>PALAUTUS</div>
        <div class="f-btn" onclick="manualPrice()"><span>F9 / /</span>HINTA</div>
        <div class="f-btn" onclick="cancelReceipt()"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn pay" onclick="openPayment()"><span>F12 / +</span>MAKSA</div>
    </div>
</div>

<div id="main-modal" class="modal">
    <div class="modal-content" id="modal-content"></div>
</div>

<script>
    let db = {
        products: [
            {id: "1", name: "VASARA", price: 19.90, cat: "TYÖKALUT"},
            {id: "2", name: "RUUVIT 500kpl", price: 12.50, cat: "RAKENNUS"},
            {id: "3", name: "SISÄMAALI 10L", price: 89.00, cat: "MAALIT"},
            {id: "4", name: "KOSKI-KORVA 1L", price: 34.00, cat: "MAALIT"}
        ],
        categories: ["TYÖKALUT", "RAKENNUS", "MAALIT"],
        sellers: [{id: "1234", name: "Matti Meikäläinen"}],
        members: [{id: "07141386", name: "Kanta-asiakas 1"}]
    };

    let cart = [], input = "", multiplier = 1, overridePrice = null;
    let mode = "LOGIN", currentCat = "TYÖKALUT", selectedIdx = -1, isReturn = false;

    function init() {
        renderCategories(); renderProducts(); renderNumpad();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
    }

    function logout() { location.reload(); }

    function updateDisplay() {
        let prefix = multiplier !== 1 ? multiplier + " x " : "";
        let priceTag = overridePrice !== null ? "(HINTA: " + overridePrice + ") " : "";
        document.getElementById('pos-input-display').innerText = priceTag + prefix + (input || "0.00");
        if(mode === "LOGIN") document.getElementById('login-display').innerText = input.replace(/./g, '*');
    }

    function addToCart(p) {
        let price = overridePrice !== null ? overridePrice : p.price;
        if(isReturn) price = -Math.abs(price);
        
        cart.push({ ...p, price: price, qty: multiplier, originalPrice: price });
        multiplier = 1; overridePrice = null; input = "";
        selectedIdx = cart.length - 1;
        updateReceipt(); updateDisplay();
    }

    function updateReceipt() {
        let h = ""; let total = 0;
        cart.forEach((item, idx) => {
            let rowTotal = item.price * item.qty;
            h += `<div class="receipt-row ${selectedIdx === idx ? 'selected' : ''}" onclick="selectedIdx=${idx};updateReceipt()">
                <span>${item.qty}x ${item.name}</span><span>${rowTotal.toFixed(2)}€</span></div>`;
            total += rowTotal;
        });
        document.getElementById('receipt-list').innerHTML = h;
        document.getElementById('total-display').innerText = total.toFixed(2);
    }

    // --- LOGIIKAT ---
    function handleEnter() {
        if(mode === "LOGIN") {
            let s = db.sellers.find(x => x.id === input);
            if(s) { mode = "SALE"; document.getElementById('login-screen').style.display="none"; document.getElementById('h-seller').innerText="MYYJÄ: "+s.name; }
            input = "";
        } else {
            let p = db.products.find(x => x.id === input);
            if(p) addToCart(p); else input = "";
        }
        updateDisplay();
    }

    function manualPrice() { if(input !== "") { overridePrice = parseFloat(input.replace(',','.')); input = ""; updateDisplay(); } }
    function setMultiplier() { if(input !== "") { multiplier = parseFloat(input.replace(',','.')); input = ""; updateDisplay(); } }
    function applyDiscount() {
        if(selectedIdx > -1 && input !== "") {
            let pct = parseFloat(input.replace(',','.'));
            cart[selectedIdx].price = cart[selectedIdx].originalPrice * (1 - pct/100);
            input = ""; updateReceipt(); updateDisplay();
        }
    }

    function removeItem() { if(selectedIdx > -1) { cart.splice(selectedIdx, 1); selectedIdx = -1; updateReceipt(); } }
    function toggleReturn() { isReturn = !isReturn; document.getElementById('main-header').classList.toggle('return-mode'); document.getElementById('h-mode').innerText = isReturn ? "PALAUTUS" : "MYYNTI"; }
    function cancelReceipt() { if(confirm("Mitätöidäänkö kuitti?")) { cart = []; updateReceipt(); } }

    function searchMember() {
        let m = db.members.find(x => x.id === input);
        if(m) { alert("Jäsen löytyi: " + m.name); input = ""; updateDisplay(); }
    }

    // --- MAKSUVALIKKO JA SIMULAATIOT ---
    function openPayment() {
        let t = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        if(t === 0) return;
        showModal(`
            <h2 style="text-align:center;">MAKSU: ${t.toFixed(2)} €</h2>
            <div style="display:grid; gap:10px;">
                <button class="num-btn action" onclick="payCash(${t})">KÄTEINEN</button>
                <button class="num-btn action" onclick="payCard(${t})">MAKSUKORTTI</button>
                <button class="num-btn" style="background:#666; color:white;" onclick="closeModal()">PERUUTA</button>
            </div>
        `);
    }

    function payCash(total) {
        let rounded = Math.round(total * 20) / 20;
        showModal(`
            <h3>KÄTEISMAKSU</h3>
            <p>Yhteensä: ${total.toFixed(2)}€<br>Pyöristetty: <b>${rounded.toFixed(2)}€</b></p>
            <input type="text" id="cash-in" placeholder="Syötä summa" style="width:100%; font-size:2.5rem; padding:10px; text-align:right;">
            <div id="change-display" style="font-size:2.5rem; font-weight:bold; color:var(--success); margin-top:15px; text-align:center;"></div>
            <button class="num-btn action" style="width:100%; margin-top:15px;" onclick="calculateChange(${rounded})">HYVÄKSY</button>
        `);
        setTimeout(() => document.getElementById('cash-in').focus(), 100);
    }

    function calculateChange(rounded) {
        let rec = parseFloat(document.getElementById('cash-in').value.replace(',','.'));
        if(rec >= rounded) {
            let change = rec - rounded;
            document.getElementById('change-display').innerHTML = `VAIHTORAHAA: ${change.toFixed(2)} €`;
            setTimeout(() => { cart=[]; updateReceipt(); closeModal(); }, 2500);
        }
    }

    function payCard(total) {
        showModal(`<h3>KORTTIMAKSU</h3><div id="card-sim" style="font-size:1.8rem; text-align:center; padding:40px; color:var(--k-blue);">ODOTETAAN KORTTIA...</div>`);
        setTimeout(() => { document.getElementById('card-sim').innerText = "LUETAAN SIRUA..."; }, 1500);
        setTimeout(() => { document.getElementById('card-sim').innerText = "VARMISTETAAN..."; }, 3000);
        setTimeout(() => { document.getElementById('card-sim').style.color="var(--success)"; document.getElementById('card-sim').innerText = "HYVÄKSYTTY!"; }, 4500);
        setTimeout(() => { cart=[]; updateReceipt(); closeModal(); }, 6000);
    }

    // --- NÄPPÄIMISTÖ INFRA ---
    function renderNumpad() {
        let keys = ['7','8','9','/','4','5','6','*','1','2','3','+','0',',','CLR','ENT'];
        keys.forEach(k => {
            let b = document.createElement('button'); 
            b.className = "num-btn" + (['/','*','+','CLR','ENT'].includes(k) ? " action" : ""); 
            b.innerText = k;
            b.onclick = () => {
                if(k==='ENT') handleEnter();
                else if(k==='CLR') { input=""; updateDisplay(); }
                else if(k==='*') setMultiplier();
                else if(k==='/') manualPrice();
                else if(k==='+') openPayment();
                else { input += k; updateDisplay(); }
            };
            document.getElementById('numpad-ui').appendChild(b);
        });
    }

    window.addEventListener('keydown', e => {
        if(e.key.startsWith('F')) e.preventDefault();
        if(e.key === 'Enter') handleEnter();
        if(e.key === '*') setMultiplier();
        if(e.key === '/') manualPrice();
        if(e.key === '+') openPayment();
        if(e.key === 'F5') applyDiscount();
        if(e.key === 'F6') removeItem();
        if(e.key === 'F7') toggleReturn();
        if(e.key === 'F11') cancelReceipt();
        if(e.key === 'F12') openPayment();
        if(e.key === 'Backspace') { input = input.slice(0, -1); updateDisplay(); }
        if(!isNaN(e.key) || e.key === ',' || e.key === '.') { input += e.key.replace(',','.'); updateDisplay(); }
    });

    function showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('main-modal').style.display="flex"; }
    function closeModal() { document.getElementById('main-modal').style.display="none"; }
    function renderCategories() { document.getElementById('category-grid').innerHTML = db.categories.map(c => `<div class="cat-item ${currentCat===c?'active':''}" onclick="currentCat='${c}';renderCategories();renderProducts();">${c}</div>`).join(''); }
    function renderProducts() { document.getElementById('product-grid').innerHTML = db.products.filter(p => p.cat === currentCat).map(p => `<div class="grid-item" onclick='addToCart(${JSON.stringify(p)})'>${p.name}<br>${p.price.toFixed(2)}€</div>`).join(''); }
</script>
</body>
</html>
