<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-RAUTA POS v32.0 - FULL MGMT</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1; --danger: #cc0000; --success: #28a745; --terminal-green: #0f0; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: var(--k-blue); color: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 4px solid var(--k-orange); }
        header.return-mode { background: var(--danger); }
        
        .main-container { display: flex; flex: 1; gap: 8px; padding: 8px; height: calc(100vh - 68px); overflow: hidden; }
        .left-panel { width: 480px; display: flex; flex-direction: column; gap: 8px; }
        .receipt-area { flex: 1; background: white; border: 2px solid #666; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 15px; font-size: 1rem; }
        .receipt-row { padding: 8px 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer; }
        .receipt-row.selected { background: var(--k-blue) !important; color: white; }
        
        .total-container { background: #eee; border-top: 3px solid #999; padding: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 2.8rem; font-weight: bold; color: var(--k-blue); }

        .input-display { background: #000; color: var(--terminal-green); padding: 10px 20px; text-align: right; font-size: 3.2rem; font-family: 'Courier New', monospace; border: 5px inset #444; min-height: 70px; }

        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
        .product-display { flex: 1; background: #bbb; border: 2px solid #888; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 100px; gap: 10px; overflow-y: auto; }
        .category-bar { height: 75px; background: #999; display: flex; gap: 5px; padding: 5px; overflow-x: auto; border-top: 2px solid #777; }
        
        .grid-item { background: white; border: 1px solid #666; border-bottom: 5px solid var(--k-blue); font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5px; }
        .cat-item { min-width: 120px; background: var(--k-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; text-align: center; border: 1px solid #333; flex-shrink: 0; }
        .cat-item.active { background: var(--k-orange); }

        .right-panel { width: 170px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #fdfdfd; border: 2px solid #777; font-size: 0.8rem; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-transform: uppercase; }
        .f-btn span { color: var(--k-blue); font-size: 1.1rem; }
        .f-btn.pay { background: var(--success); color: white; }
        .f-btn.gift { background: #fffde7; border: 2px solid #fbc02d; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 95%; max-width: 1100px; height: 90vh; padding: 25px; border: 10px solid var(--k-blue); overflow-y: auto; position: relative; }
        
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px; flex-wrap: wrap; }
        .admin-nav button { padding: 12px 18px; cursor: pointer; font-weight: bold; background: #eee; border: 1px solid #999; }
        .admin-nav button.active-nav { background: var(--k-orange); color: white; border-color: var(--k-orange); }
        
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #ccc; padding: 12px; text-align: left; }
        .admin-table tr:hover { background: #f9f9f9; }

        .login-screen { position: fixed; inset: 0; background: var(--k-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .btn-small { padding: 5px 10px; cursor: pointer; margin-right: 5px; }
        .btn-del { background: var(--danger); color: white; border: none; }
        .btn-edit { background: var(--k-blue); color: white; border: none; }
    </style>
</head>
<body onload="init()">

<div id="login-screen" class="login-screen">
    <div style="font-size: 6rem; font-weight: 900;">K-RAUTA</div>
    <div style="background:white; color:black; padding:20px 60px; font-size:4rem; border:10px solid var(--k-orange); margin: 20px; font-family: monospace;" id="login-input-ui">****</div>
    <p>SYÖTÄ MYYJÄNUMERO</p>
</div>

<header id="main-header">
    <div id="h-receipt">KUITTI: #10001</div>
    <div id="h-mode" style="background:white; color:black; padding:5px 15px; font-weight:bold;">MYYNTI</div>
    <div id="h-member">JÄSEN: EI</div>
    <div id="h-seller">MYYJÄ: -</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-container">
                <div class="total-row"><span>YHTEENSÄ</span><span id="total-display">0.00</span></div>
            </div>
        </div>
        <div class="input-display" id="pos-input-display">0.00</div>
        <div id="numpad-ui" style="display:grid; grid-template-columns:repeat(4,1fr); gap:4px;"></div>
    </div>

    <div class="center-panel">
        <div class="product-display" id="product-grid"></div>
        <div class="category-bar" id="category-grid"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="logout()"><span>F1</span>ULOS</div>
        <div class="f-btn" onclick="openAdmin()"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="handleFKey('F3')"><span>F3</span>HAE JÄSEN</div>
        <div class="f-btn" onclick="handleFKey('F4')"><span>F4</span>JÄSENET</div>
        <div class="f-btn" onclick="handleFKey('F5')"><span>F5</span>ALE %</div>
        <div class="f-btn" onclick="handleFKey('F6')"><span>F6</span>POISTA</div>
        <div class="f-btn" id="btn-return" onclick="toggleReturnMode()"><span>F7</span>PALAUTUS</div>
        <div class="f-btn gift" onclick="sellGiftCardAuto()"><span>F8</span>LAHJAKORTTI</div>
        <div class="f-btn" style="opacity:0.2;"><span>F9</span>-</div>
        <div class="f-btn" style="opacity:0.2;"><span>F10</span>-</div>
        <div class="f-btn" onclick="handleFKey('F11')"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn pay" onclick="openPayment()"><span>F12 / +</span>MAKSA</div>
    </div>
</div>

<div id="main-modal" class="modal">
    <div class="modal-content">
        <div id="modal-body"></div>
        <button onclick="closeModals()" style="margin-top:20px; width:100%; padding:15px; background:#666; color:white; font-weight:bold; border:none; cursor:pointer;">SULJE HALLINTA</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('krauta_v32_db')) || {
        products: [
            {id: "101", name: "VASARA", price: 19.90, mPrice: 15.00, cat: "TYÖKALUT"},
            {id: "102", name: "RUUVIT 500kpl", price: 29.90, mPrice: 22.00, cat: "RAKENNUS"},
            {id: "103", name: "SISÄMAALI 10L", price: 89.00, mPrice: 65.00, cat: "MAALIT"}
        ],
        categories: ["TYÖKALUT", "RAKENNUS", "MAALIT"],
        sellers: [{id: "4422", name: "Matti K."}, {id: "1234", name: "Admin"}],
        members: [{id: "100", name: "Teppo Testaaja", type: "Kulta"}],
        sales: [],
        giftcards: [],
        nextReceipt: 10001,
        nextGiftCardID: 5001
    };

    let cart = [], input = "", mode = "LOGIN", currentSeller = null;
    let isReturnMode = false, currentCat = "TYÖKALUT", currentMember = null, selectedIdx = -1;

    function save() { localStorage.setItem('krauta_v32_db', JSON.stringify(db)); }
    function init() {
        if(db.categories.length > 0 && !db.categories.includes(currentCat)) currentCat = db.categories[0];
        renderCategories(); renderProducts(); renderNumpad();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
    }

    function logout() { location.reload(); }

    function toggleReturnMode() {
        isReturnMode = !isReturnMode;
        document.getElementById('main-header').className = isReturnMode ? "return-mode" : "";
        document.getElementById('h-mode').innerText = isReturnMode ? "PALAUTUS" : "MYYNTI";
        document.getElementById('btn-return').classList.toggle('active-return');
        updateReceipt();
    }

    function sellGiftCardAuto() {
        let val = parseFloat(prompt("Lahjakortin arvo (€):"));
        if(!isNaN(val) && val > 0) {
            let code = db.nextGiftCardID.toString();
            let price = isReturnMode ? -Math.abs(val) : Math.abs(val);
            cart.push({id: "GC", name: "LAHJAKORTTI #" + code, price: price, qty: 1, gcCode: code});
            db.nextGiftCardID++;
            save(); updateReceipt();
        }
    }

    function openAdmin() {
        mode = "ADMIN";
        adminView('PRODUCTS');
        document.getElementById('main-modal').style.display = "flex";
    }

    function adminView(view) {
        let h = `<div class="admin-nav">
            <button class="${view==='PRODUCTS'?'active-nav':''}" onclick="adminView('PRODUCTS')">TUOTTEET</button>
            <button class="${view==='CATEGORIES'?'active-nav':''}" onclick="adminView('CATEGORIES')">KATEGORIAT</button>
            <button class="${view==='SALES'?'active-nav':''}" onclick="adminView('SALES')">MYYNTI</button>
            <button class="${view==='GIFTCARDS'?'active-nav':''}" onclick="adminView('GIFTCARDS')">LAHJAKORTIT</button>
        </div><div id="admin-sub-content">`;

        if(view === 'PRODUCTS') {
            h += `<h3>TUOTTEET <button onclick="addProduct()">+ LISÄÄ TUOTE</button></h3><table class="admin-table">
                <tr><th>ID</th><th>NIMI</th><th>HINTA</th><th>KATEGORIA</th><th>TOIMINNOT</th></tr>
                ${db.products.map((p, idx) => `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.price}€</td><td>${p.cat}</td>
                <td><button class="btn-small btn-del" onclick="deleteProduct(${idx})">POISTA</button></td></tr>`).join('')}</table>`;
        } 
        else if(view === 'CATEGORIES') {
            h += `<h3>TUOTERYHMÄT <button onclick="addCategory()">+ LISÄÄ KATEGORIA</button></h3><table class="admin-table">
                <tr><th>RYHMÄN NIMI</th><th>TUOTTEITA</th><th>TOIMINNOT</th></tr>
                ${db.categories.map((c, idx) => {
                    let count = db.products.filter(p => p.cat === c).length;
                    return `<tr><td><b>${c}</b></td><td>${count} kpl</td>
                    <td><button class="btn-small btn-edit" onclick="editCategory(${idx})">MUOKKAA</button>
                    <button class="btn-small btn-del" onclick="deleteCategory(${idx})">POISTA</button></td></tr>`;
                }).join('')}</table>`;
        }
        else if(view === 'SALES') {
            h += `<h3>MYYNTIHISTORIA</h3><table class="admin-table">
                <tr><th>ID</th><th>AIKA</th><th>SUMMA</th><th>TAPA</th></tr>
                ${db.sales.slice().reverse().map(s => `<tr><td>#${s.id}</td><td>${new Date(s.time).toLocaleString()}</td><td>${s.total.toFixed(2)}€</td><td>${s.method}</td></tr>`).join('')}</table>`;
        }
        else if(view === 'GIFTCARDS') {
            h += `<h3>LAHJAKORTIT</h3><table class="admin-table">
                <tr><th>KOODI</th><th>SALDO</th><th>LUOTU</th></tr>
                ${db.giftcards.map(g => `<tr><td>${g.code}</td><td>${g.balance.toFixed(2)}€</td><td>${new Date(g.created).toLocaleDateString()}</td></tr>`).join('')}</table>`;
        }
        
        h += `</div>`;
        document.getElementById('modal-body').innerHTML = h;
    }

    // KATEGORIA-TOIMINNOT
    function addCategory() {
        let name = prompt("Uuden kategorian nimi:");
        if(name && !db.categories.includes(name.toUpperCase())) {
            db.categories.push(name.toUpperCase());
            save(); adminView('CATEGORIES'); renderCategories();
        }
    }

    function editCategory(idx) {
        let oldName = db.categories[idx];
        let newName = prompt("Uusi nimi kategorialle " + oldName + ":", oldName);
        if(newName && newName.toUpperCase() !== oldName) {
            newName = newName.toUpperCase();
            // Päivitetään myös kaikki tuotteet tähän kategoriaan
            db.products.forEach(p => { if(p.cat === oldName) p.cat = newName; });
            db.categories[idx] = newName;
            if(currentCat === oldName) currentCat = newName;
            save(); adminView('CATEGORIES'); renderCategories(); renderProducts();
        }
    }

    function deleteCategory(idx) {
        let name = db.categories[idx];
        let count = db.products.filter(p => p.cat === name).length;
        if(count > 0) {
            alert("Kategoriaa ei voi poistaa, koska siinä on " + count + " tuotetta. Siirrä tai poista tuotteet ensin.");
            return;
        }
        if(confirm("Poistetaanko kategoria: " + name + "?")) {
            db.categories.splice(idx, 1);
            if(currentCat === name) currentCat = db.categories[0] || "";
            save(); adminView('CATEGORIES'); renderCategories(); renderProducts();
        }
    }

    function deleteProduct(idx) {
        if(confirm("Poistetaanko tuote?")) {
            db.products.splice(idx, 1);
            save(); adminView('PRODUCTS'); renderProducts();
        }
    }

    function addProduct() {
        let id = prompt("EAN/Koodi:");
        let name = prompt("Tuotteen nimi:");
        let price = parseFloat(prompt("Hinta (€):"));
        let cat = prompt("Kategoria (" + db.categories.join(", ") + "):").toUpperCase();
        if(id && name && !isNaN(price)) {
            if(!db.categories.includes(cat)) db.categories.push(cat);
            db.products.push({id, name, price, mPrice: price * 0.8, cat});
            save(); adminView('PRODUCTS'); renderCategories(); renderProducts();
        }
    }

    // PERUSTOIMINNOT
    function addToCart(p) {
        let price = currentMember ? p.mPrice : p.price;
        if(isReturnMode) price = -Math.abs(price);
        cart.push({...p, price: price, qty: 1});
        selectedIdx = cart.length - 1; updateReceipt();
    }

    function updateReceipt() {
        let h = ""; let t = 0;
        cart.forEach((i, idx) => {
            h += `<div class="receipt-row ${selectedIdx === idx ? 'selected' : ''}" onclick="selectedIdx=${idx};updateReceipt()">
                <span>1x ${i.name}</span><span>${i.price.toFixed(2)}€</span></div>`;
            t += i.price;
        });
        document.getElementById('receipt-list').innerHTML = h;
        document.getElementById('total-display').innerText = t.toFixed(2);
        document.getElementById('h-member').innerText = currentMember ? "JÄSEN: " + currentMember.name : "JÄSEN: EI";
        return t;
    }

    function openPayment() {
        let t = updateReceipt(); if(t === 0) return;
        let method = confirm("KORTTIMAKSU (OK) vai KÄTEINEN (Cancel)?") ? "KORTTI" : "KÄTEINEN";
        db.sales.push({id: db.nextReceipt++, total: t, time: new Date(), method: method});
        cart.forEach(i => { if(i.gcCode) db.giftcards.push({code: i.gcCode, balance: i.price, created: new Date()}); });
        save(); cart = []; isReturnMode = false; currentMember = null;
        document.getElementById('main-header').className = "";
        updateReceipt();
    }

    function handleEnter() {
        if (mode === "LOGIN") {
            let s = db.sellers.find(x => x.id === input);
            if (s) { mode="SALE"; currentSeller = s; document.getElementById('login-screen').style.display="none"; document.getElementById('h-seller').innerText = "MYYJÄ: " + s.name; }
            input = ""; updateDisplay();
        } else {
            let p = db.products.find(x => x.id === input);
            if (p) addToCart(p);
            input = ""; updateDisplay();
        }
    }

    window.addEventListener('keydown', e => {
        if(e.key.startsWith('F')) e.preventDefault();
        if(e.key === 'Enter') handleEnter();
        if(e.key === 'Backspace') { input = input.slice(0,-1); updateDisplay(); }
        if(e.key === '+') openPayment();
        if(!isNaN(e.key) || e.key === '.') { input += e.key; updateDisplay(); }
    });

    function renderProducts() {
        document.getElementById('product-grid').innerHTML = db.products.filter(p => p.cat === currentCat).map(p => 
            `<div class="grid-item" onclick='addToCart(${JSON.stringify(p)})'>${p.name}<br>${p.price.toFixed(2)}€</div>`).join('');
    }
    function renderCategories() {
        document.getElementById('category-grid').innerHTML = db.categories.map(c => 
            `<div class="cat-item ${currentCat===c?'active':''}" onclick="currentCat='${c}';renderCategories();renderProducts();">${c}</div>`).join('');
    }
    function updateDisplay() { document.getElementById('pos-input-display').innerText = input || "0.00"; }
    function closeModals() { document.getElementById('main-modal').style.display="none"; mode="SALE"; }
    function renderNumpad() {
        let pad = ['7','8','9','4','5','6','1','2','3','0','CLR','ENT'];
        pad.forEach(k => {
            let b = document.createElement('button'); b.className = "f-btn"; b.innerText = k;
            b.onclick = () => { if(k==='ENT') handleEnter(); else if(k==='CLR') { input=""; updateDisplay(); } else { input += k; updateDisplay(); } };
            document.getElementById('numpad-ui').appendChild(b);
        });
    }

    function handleFKey(key) {
        if(key === 'F6' && selectedIdx > -1) { cart.splice(selectedIdx, 1); selectedIdx = -1; updateReceipt(); }
        if(key === 'F11' && confirm("Mitätöi?")) { cart=[]; updateReceipt(); }
        if(key === 'F3') { let id = prompt("Jäsennro:"); currentMember = db.members.find(x => x.id === id); updateReceipt(); }
    }
</script>
</body>
</html>
