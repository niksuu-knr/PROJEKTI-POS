<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-RAUTA POS v36.8 - THE MASTER BUILD</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1; --danger: #cc0000; --success: #28a745; --terminal-green: #0f0; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: var(--k-blue); color: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 4px solid var(--k-orange); flex-shrink: 0; }
        .main-container { display: flex; flex: 1; gap: 8px; padding: 8px; height: calc(100vh - 68px); overflow: hidden; }
        
        /* Vasen paneeli: Kuitti ja Numpad */
        .left-panel { width: 480px; display: flex; flex-direction: column; gap: 8px; }
        .member-info-bar { background: #fff3e0; padding: 10px; border-left: 5px solid var(--k-orange); font-weight: bold; min-height: 20px; }
        .receipt-area { flex: 1; background: white; border: 2px solid #666; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 15px; }
        .receipt-row { padding: 12px 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer; }
        .receipt-row.selected { background: var(--k-blue) !important; color: white; }
        
        .total-container { background: #eee; border-top: 3px solid #999; padding: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 2.5rem; font-weight: bold; color: var(--k-blue); }

        .input-display { background: #000; color: var(--terminal-green); padding: 10px 20px; text-align: right; font-size: 3rem; font-family: 'Courier New', monospace; border: 5px inset #444; min-height: 80px; }
        .numpad-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .num-btn { height: 70px; background: #fdfdfd; border: 2px solid #777; font-size: 1.5rem; font-weight: bold; cursor: pointer; }

        /* Keskipaneeli: Tuotegridi */
        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
        .product-display { flex: 1; background: #bbb; border: 2px solid #888; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 100px; gap: 10px; overflow-y: auto; }
        .category-bar { height: 70px; background: #999; display: flex; gap: 5px; padding: 5px; overflow-x: auto; flex-shrink: 0; }
        .grid-item { background: white; border: 1px solid #666; border-bottom: 5px solid var(--k-blue); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.9rem; }
        .cat-item { min-width: 120px; background: var(--k-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .cat-item.active { background: var(--k-orange); }

        /* Oikea paneeli: F-näppäimet */
        .right-panel { width: 160px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #fdfdfd; border: 2px solid #777; font-size: 0.8rem; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 1.1rem; }
        .f-btn.pay { background: var(--success); color: white; }

        /* MODAALIT (Admin, Jäsen, Maksu) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: #eee; width: 800px; max-height: 90vh; border: 8px solid var(--k-blue); display: flex; flex-direction: column; }
        .modal-header { background: var(--k-blue); color: white; padding: 15px; font-weight: bold; font-size: 1.2rem; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: white; }
        
        .admin-nav { background: #444; display: flex; padding: 10px; gap: 5px; }
        .admin-nav button { padding: 10px; cursor: pointer; font-weight: bold; }
        .admin-nav button.active { background: var(--k-orange); color: white; border: none; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-btn { padding: 20px; font-weight: bold; background: #fff; border: 2px solid #ccc; text-align: center; cursor: pointer; }
        .menu-btn:hover { background: var(--k-orange); color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body onload="init()">

<header>
    <div style="font-weight: 900; font-size: 1.5rem;">K-RAUTA POS v36.8</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div id="member-bar" class="member-info-bar">EI JÄSENTÄ VALITTUNA</div>
        <div class="receipt-area">
            <div id="receipt-list" class="receipt-content"></div>
            <div class="total-container">
                <div class="total-row"><span>YHTEENSÄ</span><span id="total-display">0.00</span></div>
            </div>
        </div>
        <div id="pos-input-display" class="input-display">0.00</div>
        <div id="numpad-ui" class="numpad-container"></div>
    </div>

    <div class="center-panel">
        <div id="product-grid" class="product-display"></div>
        <div id="category-grid" class="category-bar"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="location.reload()"><span>F1</span>ULOS</div>
        <div class="f-btn" onclick="openAdmin('PRODUCTS')"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="handleFKey('F3')"><span>F3</span>JÄSEN</div>
        <div class="f-btn" onclick="handleFKey('F5')"><span>F5</span>ALE (RIVI)</div>
        <div class="f-btn" onclick="handleFKey('F6')"><span>F6</span>POISTA</div>
        <div class="f-btn" onclick="handleFKey('F9')"><span>F9 /</span>HINTA</div>
        <div class="f-btn" onclick="handleFKey('F11')"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn pay" onclick="handleFKey('F12')"><span>F12 / +</span>MAKSA</div>
    </div>
</div>

<!-- UNIVERSAALI MODAALI (Admin, Jäsen, Maksu) -->
<div id="master-modal" class="modal">
    <div class="modal-content">
        <div id="admin-nav-area" class="admin-nav" style="display:none;">
            <button id="n-P" onclick="openAdmin('PRODUCTS')">TUOTTEET</button>
            <button id="n-C" onclick="openAdmin('CATEGORIES')">KATEGORIAT</button>
            <button id="n-S" onclick="openAdmin('SELLERS')">MYYJÄT</button>
            <button id="n-M" onclick="openAdmin('MEMBERS')">JÄSENET</button>
        </div>
        <div class="modal-header" id="m-header">VALIKKO</div>
        <div class="modal-body" id="m-body"></div>
        <div style="padding:10px; background:#ddd; text-align:right;">
            <button onclick="closeModal()" style="padding:10px 20px; font-weight:bold; background:var(--danger); color:white;">SULJE</button>
        </div>
    </div>
</div>

<script>
    // --- DATA & STATE ---
    let db = JSON.parse(localStorage.getItem('krauta_master_db')) || {
        products: [{id: "1", name: "VASARA", price: 19.90, cat: "TYÖKALUT"}],
        categories: ["TYÖKALUT", "RAKENNUS"],
        sellers: [{id: "1234", name: "Esimerkki"}],
        members: [{id: "0714", name: "Testi Jäsen"}]
    };
    let cart = [], input = "", currentCat = "TYÖKALUT", currentMember = null, selectedIdx = -1, totalDiscount = 0;

    function save() { localStorage.setItem('krauta_master_db', JSON.stringify(db)); }

    function init() {
        renderProducts(); renderCategories(); renderNumpad();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
    }

    // --- F-NÄPPÄIN LOGIIKKA ---
    function handleFKey(key) {
        if(key === 'F3') openMemberLogic();
        if(key === 'F5') openDiscountLogic(false);
        if(key === 'F6' && selectedIdx > -1) { cart.splice(selectedIdx, 1); selectedIdx = -1; updateReceipt(); }
        if(key === 'F11') { if(confirm("Mitätöidäänkö kuitti?")) { cart=[]; currentMember=null; totalDiscount=0; updateReceipt(); } }
        if(key === 'F12') openPaymentLogic();
    }

    // --- JÄSENHAKU/LISÄYS (F3) ---
    function openMemberLogic() {
        document.getElementById('admin-nav-area').style.display = "none";
        document.getElementById('m-header').innerText = "JÄSENHAKU: " + input;
        let m = db.members.find(x => x.id === input);
        let html = "";
        if(m) {
            html = `<div class="menu-btn" onclick="selectMember('${m.id}')">VALITSE: ${m.name}</div>`;
        } else {
            html = `<p>Jäsentä ei löydy numerolla ${input}.</p>
                    <input type="text" id="new-m-name" placeholder="Asiakkaan nimi" style="width:100%; padding:10px; font-size:1.2rem;">
                    <button class="menu-btn" style="width:100%; margin-top:10px;" onclick="addMember('${input}')">REKISTERÖI UUSI</button>`;
        }
        document.getElementById('m-body').innerHTML = html;
        document.getElementById('master-modal').style.display = "flex";
    }

    function selectMember(id) {
        currentMember = db.members.find(x => x.id === id);
        document.getElementById('member-bar').innerText = "JÄSEN: " + currentMember.name;
        input = ""; updateDisplay(); closeModal();
    }

    function addMember(id) {
        let n = document.getElementById('new-m-name').value;
        if(!n) return;
        db.members.push({id: id, name: n});
        save(); selectMember(id);
    }

    // --- ALENNUKSET (F5 & Maksuvalikko) ---
    function openDiscountLogic(isGlobal) {
        if(!isGlobal && selectedIdx === -1) { alert("Valitse rivi!"); return; }
        document.getElementById('admin-nav-area').style.display = "none";
        document.getElementById('m-header').innerText = isGlobal ? "ALENNUS LOPPUSUMMASTA" : "RIVIALENNUS";
        document.getElementById('m-body').innerHTML = `
            <div class="menu-grid">
                <div class="menu-btn" onclick="applyDiscount(10, ${isGlobal})">10%</div>
                <div class="menu-btn" onclick="applyDiscount(20, ${isGlobal})">20%</div>
                <div class="menu-btn" onclick="applyDiscount(50, ${isGlobal})">50%</div>
                <div class="menu-btn" onclick="applyDiscount(100, ${isGlobal})">100%</div>
            </div>`;
        document.getElementById('master-modal').style.display = "flex";
    }

    function applyDiscount(pct, isGlobal) {
        if(isGlobal) {
            let sub = cart.reduce((a, b) => a + (b.price * b.qty), 0);
            totalDiscount = sub * (pct / 100);
            openPaymentLogic();
        } else {
            let item = cart[selectedIdx];
            if(!item.origPrice) item.origPrice = item.price;
            item.price = item.origPrice * (1 - (pct / 100));
            closeModal();
        }
        updateReceipt();
    }

    // --- MAKSU (F12) ---
    function openPaymentLogic() {
        let sub = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        let final = sub - totalDiscount;
        document.getElementById('admin-nav-area').style.display = "none";
        document.getElementById('m-header').innerText = "MAKSUVALIKKO";
        document.getElementById('m-body').innerHTML = `
            <h1 style="text-align:center;">${final.toFixed(2)} €</h1>
            <div class="menu-grid">
                <div class="menu-btn" onclick="alert('KÄTEINEN OK');location.reload()">KÄTEINEN</div>
                <div class="menu-btn" onclick="alert('KORTTI OK');location.reload()">KORTTI</div>
                <div class="menu-btn" style="grid-column: span 2; background:#fff3e0;" onclick="openDiscountLogic(true)">LISÄÄ ALENNUS YHTEENSÄ</div>
            </div>`;
        document.getElementById('master-modal').style.display = "flex";
    }

    // --- HALLINTAPANEELI (F2) ---
    function openAdmin(view) {
        document.getElementById('admin-nav-area').style.display = "flex";
        document.getElementById('m-header').innerText = "HALLINTA: " + view;
        let html = "";
        if(view === 'PRODUCTS') {
            html = `<input type="text" id="p-n" placeholder="Nimi"> <input type="number" id="p-p" placeholder="Hinta"> 
                    <button onclick="db.products.push({id:Date.now(), name:document.getElementById('p-n').value, price:parseFloat(document.getElementById('p-p').value), cat:currentCat});save();openAdmin('PRODUCTS');renderProducts();">LISÄÄ</button>
                    <table>${db.products.map((p,i)=>`<tr><td>${p.name}</td><td>${p.price}€</td><td><button onclick="db.products.splice(${i},1);save();openAdmin('PRODUCTS');renderProducts();">X</button></td></tr>`).join('')}</table>`;
        }
        if(view === 'CATEGORIES') {
            html = `<input type="text" id="c-n"> <button onclick="db.categories.push(document.getElementById('c-n').value);save();openAdmin('CATEGORIES');renderCategories();">LISÄÄ</button>
                    <table>${db.categories.map((c,i)=>`<tr><td>${c}</td><td><button onclick="db.categories.splice(${i},1);save();openAdmin('CATEGORIES');renderCategories();">X</button></td></tr>`).join('')}</table>`;
        }
        document.getElementById('m-body').innerHTML = html || "Sivu työn alla...";
        document.getElementById('master-modal').style.display = "flex";
    }

    // --- INFRA ---
    function closeModal() { document.getElementById('master-modal').style.display = "none"; }
    function addToCart(p) { cart.push({...p, qty: 1}); updateReceipt(); }
    function updateReceipt() {
        let sub = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        document.getElementById('receipt-list').innerHTML = cart.map((item, i) => `
            <div class="receipt-row ${selectedIdx === i ? 'selected' : ''}" onclick="selectedIdx=${i};updateReceipt()">
                <span>${item.name}</span><span>${item.price.toFixed(2)}€</span>
            </div>`).join('') + (totalDiscount > 0 ? `<div style="color:red; padding:10px;">ALE: -${totalDiscount.toFixed(2)}€</div>` : "");
        document.getElementById('total-display').innerText = (sub - totalDiscount).toFixed(2);
    }
    function renderProducts() { document.getElementById('product-grid').innerHTML = db.products.filter(p => p.cat === currentCat).map(p => `<div class="grid-item" onclick='addToCart(${JSON.stringify(p)})'>${p.name}<br>${p.price.toFixed(2)}€</div>`).join(''); }
    function renderCategories() { document.getElementById('category-grid').innerHTML = db.categories.map(c => `<div class="cat-item ${currentCat===c?'active':''}" onclick="currentCat='${c}';renderCategories();renderProducts();">${c}</div>`).join(''); }
    function renderNumpad() { document.getElementById('numpad-ui').innerHTML = ['7','8','9','/','4','5','6','*','1','2','3','+','0',',','CLR','ENT'].map(k => `<button class="num-btn" onclick="btnPress('${k}')">${k}</button>`).join(''); }
    function btnPress(k) { if(k==='CLR') input=""; else if(k==='ENT') { /* Haku */ } else input+=k; updateDisplay(); }
    function updateDisplay() { document.getElementById('pos-input-display').innerText = input || "0.00"; }
</script>
</body>
</html>
