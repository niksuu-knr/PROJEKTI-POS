<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>KASSAOHJELMA V1.22.4</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1; --danger: #cc0000; --success: #28a745; --terminal-green: #0f0; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { background: var(--k-blue); color: white; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; height: 40px; border-bottom: 2px solid var(--k-orange); }
        
        .main-container { display: flex; flex: 1; gap: 5px; padding: 5px; height: calc(100vh - 45px); }
        
        /* Vasen paneeli: Kuitti ja Numpad */
        .left-panel { width: 450px; display: flex; flex-direction: column; gap: 5px; }
        .receipt-area { flex: 1; background: white; border: 1px solid #888; display: flex; flex-direction: column; overflow: hidden; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 10px; font-size: 0.85rem; }
        .receipt-row { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; transition: background 0.1s; }
        .receipt-row.selected { background: #004593 !important; color: white; outline: 2px solid var(--k-orange); font-weight: bold; }
        .receipt-row.voided { text-decoration: line-through; color: var(--danger); opacity: 0.5; }
        
        .total-container { background: #f0f0f0; border-top: 2px solid #ccc; padding: 10px; }
        .total-row { display: flex; justify-content: space-between; font-size: 2.2rem; font-weight: bold; color: var(--k-blue); }
        .input-display { background: #1a1a1a; color: var(--terminal-green); padding: 10px; text-align: right; font-size: 2.5rem; font-family: monospace; border: 3px inset #555; height: 60px; }

        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .num-btn { height: 50px; background: #fefefe; border: 1px solid #777; font-size: 1.2rem; font-weight: bold; cursor: pointer; }

        /* Keskipaneeli: Tuotteet */
        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
        .product-display { flex: 4; background: #e0e0e0; border: 1px solid #bbb; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-rows: 90px; gap: 10px; overflow-y: auto; }
        .category-bar { flex: 1; background: #bcbcbc; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 5px; padding: 5px; }
        .grid-item { background: white; border: 1px solid #888; border-bottom: 4px solid var(--k-blue); font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.8rem; }
        .cat-item { background: var(--k-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .cat-item.active { background: var(--k-orange); }

        /* Oikea paneeli: F-Näppäimet */
        .right-panel { width: 160px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 2px; }
        .f-btn { background: #eee; border: 1px solid #777; font-size: 0.7rem; font-weight: bold; padding-left: 8px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 0.8rem; }

        /* Modaalit */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: #fff; width: 85%; height: 80vh; border: 6px solid var(--k-blue); display: flex; flex-direction: column; padding: 20px; position: relative; }
        .menu-inner { text-align: center; padding: 20px; }
        .menu-btn-large { width: 100%; padding: 25px; font-size: 1.5rem; font-weight: bold; margin: 10px 0; cursor: pointer; background: #f0f0f0; border: 2px solid #888; }
        
        .admin-view { display: flex; gap: 20px; height: 100%; }
        .admin-nav { width: 220px; display: flex; flex-direction: column; gap: 8px; }
        .admin-body { flex: 1; background: #f9f9f9; padding: 15px; border: 1px solid #ccc; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: var(--k-blue); color: white; }

        .login-screen { position: fixed; inset: 0; background: var(--k-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body onload="init()">

<div id="login-screen" class="login-screen">
    <h1 style="font-size: 4rem;">K-RAUTA</h1>
    <div style="background:#fff; color:#000; padding:20px; font-size:3rem; min-width:200px; text-align:center;" id="login-input-ui"></div>
    <p>SYÖTÄ MYYJÄNUMERO JA ENTER</p>
</div>

<header>
    <div>K-RAUTA v7.8 ULTIMATE</div>
    <div id="member-info" style="color:var(--k-orange); font-weight:bold;"></div>
    <div id="seller-info">MYYJÄ: -</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-container">
                <div class="total-row"><span>YHTEENSÄ</span><span id="total-display">0.00</span></div>
            </div>
        </div>
        <div class="input-display" id="pos-input">0.00</div>
        <div class="numpad" id="numpad-ui"></div>
    </div>
    
    <div class="center-panel">
        <div class="product-display" id="product-grid"></div>
        <div class="category-bar" id="category-grid"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="handleFKey('F1')"><span>F1</span>HAKU</div>
        <div class="f-btn" onclick="handleFKey('F2')"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="handleFKey('F3')"><span>F3</span>JÄSEN</div>
        <div class="f-btn" onclick="handleFKey('F5')"><span>F5</span>ALE</div>
        <div class="f-btn" onclick="handleFKey('F6')"><span>F6</span>POISTA RIVI</div>
        <div class="f-btn" onclick="handleFKey('F8')"><span>F8</span>HINNANMUUTOS</div>
        <div class="f-btn" onclick="handleFKey('F11')"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn" style="background:var(--success); color:white;" onclick="handleFKey('F12')"><span>F12</span>MAKSA (+)</div>
    </div>
</div>

<div id="main-modal" class="modal">
    <div class="modal-content" id="modal-content"></div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('krauta_v78_db')) || {
        products: [
            {id: "101", name: "VASARA", price: 25.00, mPrice: 20.00, cat: "TYÖKALUT"},
            {id: "201", name: "RUUVIPAKKI", price: 15.00, mPrice: 12.00, cat: "TYÖKALUT"}
        ],
        categories: ["TYÖKALUT", "PIHA", "MAALIT"],
        sellers: [{id: "4422", name: "Matti"}],
        members: [{id: "100", name: "Pro Asiakas"}],
        archive: []
    };

    function save() { localStorage.setItem('krauta_v78_db', JSON.stringify(db)); }

    let cart = [];
    let input = "";
    let mode = "LOGIN"; 
    let currentMember = null;
    let selectedIdx = -1;
    let currentCat = "TYÖKALUT";
    let aleData = { target: null, type: null };

    function init() {
        renderCategories(); renderProducts(); renderNumpad();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
    }

    // NÄPPÄIMISTÖN HALLINTA (SIS. NUOLINÄPPÄIMET)
    window.addEventListener('keydown', e => {
        // Estetään selaimen oletustoiminnot F-näppäimille ja nuolille
        if (e.key.startsWith('F') || e.key === 'ArrowUp' || e.key === 'ArrowDown') { 
            e.preventDefault(); 
        }

        // --- NUOLINÄPPÄINNAVIGOINTI KUITILLA ---
        if (mode === "SALE" && cart.length > 0) {
            if (e.key === 'ArrowUp') {
                selectedIdx = (selectedIdx <= 0) ? cart.length - 1 : selectedIdx - 1;
                updateReceipt();
                scrollToSelected();
                return;
            }
            if (e.key === 'ArrowDown') {
                selectedIdx = (selectedIdx >= cart.length - 1) ? 0 : selectedIdx + 1;
                updateReceipt();
                scrollToSelected();
                return;
            }
        }

        if (e.key.startsWith('F')) { handleFKey(e.key); return; }
        if (e.key === 'Enter') { handleEnter(); return; }
        if (e.key === 'Escape') { closeModals(); return; }
        if (e.key === 'Backspace') { input = input.slice(0, -1); updateDisplay(); return; }
        if (!isNaN(e.key)) { input += e.key; updateDisplay(); }
    });

    function scrollToSelected() {
        const selectedRow = document.querySelector('.receipt-row.selected');
        if (selectedRow) {
            selectedRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
    }

    function handleFKey(key) {
        if (mode === "LOGIN") return;

        if (mode === "ALE_LEVEL") {
            if (key === 'F1') { aleData.target = 'ROW'; openAleTypeMenu(); }
            if (key === 'F2') { aleData.target = 'TOTAL'; openAleTypeMenu(); }
            return;
        }
        if (mode === "ALE_TYPE") {
            if (key === 'F1') { aleData.type = 'PERCENT'; applyDiscount(); }
            if (key === 'F2') { aleData.type = 'SUM'; applyDiscount(); }
            return;
        }

        switch(key) {
            case 'F2': openAdmin(); break;
            case 'F3': openMemberSearch(); break;
            case 'F5': openAleLevelMenu(); break;
            case 'F6': voidRow(); break;
            case 'F11': mitatoi(); break;
            case 'F12': openPayment(); break;
        }
    }

    function handleEnter() {
        if (mode === "LOGIN") {
            let s = db.sellers.find(x => x.id === input);
            if (s) { mode="SALE"; document.getElementById('login-screen').style.display="none"; document.getElementById('seller-info').innerText = "MYYJÄ: " + s.name; }
        } else if (mode === "SALE") {
            let p = db.products.find(x => x.id === input);
            if (p) addToCart(p);
        }
        input = ""; updateDisplay();
    }

    function addToCart(p) {
        let price = currentMember ? p.mPrice : p.price;
        let last = cart[cart.length - 1];
        if (last && last.id === p.id && !last.voided) {
            last.qty++;
        } else {
            cart.push({ ...p, price: price, qty: 1, voided: false });
        }
        selectedIdx = cart.length - 1;
        updateReceipt();
        setTimeout(scrollToSelected, 50);
    }

    function voidRow() {
        if (selectedIdx > -1) {
            cart[selectedIdx].voided = !cart[selectedIdx].voided;
            updateReceipt();
        }
    }

    function updateReceipt() {
        const list = document.getElementById('receipt-list');
        list.innerHTML = "";
        let total = 0;
        cart.forEach((item, i) => {
            let rowTotal = item.voided ? 0 : (item.price * item.qty);
            let div = document.createElement('div');
            div.className = `receipt-row ${selectedIdx === i ? 'selected' : ''} ${item.voided ? 'voided' : ''}`;
            div.innerHTML = `<span>${item.qty}x ${item.name}</span><span>${rowTotal.toFixed(2)}</span>`;
            div.onclick = () => { selectedIdx = i; updateReceipt(); };
            list.appendChild(div);
            total += rowTotal;
        });
        document.getElementById('total-display').innerText = total.toFixed(2);
        document.getElementById('member-info').innerText = currentMember ? "JÄSEN: " + currentMember.name : "";
    }

    // --- ALENNUKSET ---
    function openAleLevelMenu() {
        mode = "ALE_LEVEL";
        showModal(`
            <div class="menu-inner">
                <h1>ALENNUS</h1>
                <button class="menu-btn-large">F1: RIVIALENNUS</button>
                <button class="menu-btn-large">F2: KOKOALENNUS</button>
            </div>
        `);
    }

    function openAleTypeMenu() {
        mode = "ALE_TYPE";
        showModal(`
            <div class="menu-inner">
                <h1>VALITSE TYYPPI (${aleData.target})</h1>
                <p>Syötä alennusmäärä numpadilla ja valitse tyyppi:</p>
                <button class="menu-btn-large">F1: PROSENTTI (%)</button>
                <button class="menu-btn-large">F2: EUROA (€)</button>
            </div>
        `);
    }

    function applyDiscount() {
        let val = parseFloat(input) / 100;
        if (val <= 0) return;
        if (aleData.target === 'ROW') {
            if (selectedIdx > -1) {
                if (aleData.type === 'PERCENT') cart[selectedIdx].price *= (1 - val/100);
                else cart[selectedIdx].price -= (val / cart[selectedIdx].qty);
            }
        } else {
            cart.forEach(i => {
                if (!i.voided) {
                    if (aleData.type === 'PERCENT') i.price *= (1 - val/100);
                    else i.price -= (val / cart.filter(x=>!x.voided).length / i.qty);
                }
            });
        }
        input = ""; updateDisplay(); updateReceipt(); closeModals();
    }

    // --- HALLINTA ---
    function openAdmin() {
        mode = "ADMIN";
        showModal(`
            <div class="admin-view">
                <div class="admin-nav">
                    <button class="num-btn" style="width:100%" onclick="drawAdmin('products')">TUOTTEET</button>
                    <button class="num-btn" style="width:100%" onclick="drawAdmin('members')">JÄSENET</button>
                    <button class="num-btn" style="width:100%; background:var(--danger); color:#fff; margin-top:auto;" onclick="closeModals()">SULJE</button>
                </div>
                <div class="admin-body" id="admin-body"></div>
            </div>
        `);
        drawAdmin('products');
    }

    function drawAdmin(type) {
        let area = document.getElementById('admin-body');
        let html = `<h2>${type.toUpperCase()}</h2>`;
        if (type === 'products') {
            html += `<button onclick="showProductAdd()">+ LISÄÄ TUOTE</button><table><tr><th>EAN</th><th>NIMI</th><th>HINTA</th><th>X</th></tr>`;
            db.products.forEach((p, i) => html += `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.price}</td><td><button onclick="db.products.splice(${i},1);save();drawAdmin('products')">X</button></td></tr>`);
        } else if (type === 'members') {
            html += `<button onclick="showMemberAdd()">+ LISÄÄ JÄSEN</button><table><tr><th>ID</th><th>NIMI</th><th>X</th></tr>`;
            db.members.forEach((m, i) => html += `<tr><td>${m.id}</td><td>${m.name}</td><td><button onclick="db.members.splice(${i},1);save();drawAdmin('members')">X</button></td></tr>`);
        }
        area.innerHTML = html + "</table>";
    }

    function showProductAdd() {
        document.getElementById('admin-body').innerHTML = `
            <h3>UUSI TUOTE</h3>
            EAN: <input id="ni-id"><br>
            NIMI: <input id="ni-name"><br>
            HINTA: <input id="ni-p"><br>
            JÄSEN: <input id="ni-mp"><br>
            RYHMÄ: <select id="ni-c">${db.categories.map(c=>`<option>${c}</option>`).join('')}</select><br>
            <button onclick="saveNewP()">TALLENNA</button>
        `;
    }

    function saveNewP() {
        db.products.push({
            id: document.getElementById('ni-id').value,
            name: document.getElementById('ni-name').value,
            price: parseFloat(document.getElementById('ni-p').value),
            mPrice: parseFloat(document.getElementById('ni-mp').value),
            cat: document.getElementById('ni-c').value
        });
        save(); drawAdmin('products'); renderProducts();
    }

    function mitatoi() { cart=[]; currentMember=null; updateReceipt(); }
    function closeModals() { document.getElementById('main-modal').style.display="none"; mode="SALE"; input=""; updateDisplay(); }
    function showModal(h) { document.getElementById('modal-content').innerHTML = h; document.getElementById('main-modal').style.display="flex"; }
    
    function renderCategories() {
        document.getElementById('category-grid').innerHTML = db.categories.map(c => 
            `<div class="cat-item ${currentCat===c?'active':''}" onclick="currentCat='${c}'; renderCategories(); renderProducts();">${c}</div>`).join('');
    }

    function renderProducts() {
        document.getElementById('product-grid').innerHTML = db.products.filter(p => p.cat === currentCat).map(p => 
            `<div class="grid-item" onclick='addToCart(${JSON.stringify(p)})'>
                <b>${p.name}</b><span>${p.price.toFixed(2)}€</span>
                <small>Jäsen: ${p.mPrice.toFixed(2)}€</small>
            </div>`).join('');
    }

    function renderNumpad() {
        const keys = ['7','8','9','*','4','5','6','CLR','1','2','3','ENT','0','00',',','+'];
        document.getElementById('numpad-ui').innerHTML = keys.map(k => `<button class="num-btn" onclick="handleNumClick('${k}')">${k}</button>`).join('');
    }

    function handleNumClick(k) {
        if(k==='ENT') handleEnter();
        else if(k==='CLR') input="";
        else input += k;
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('pos-input').innerText = (parseFloat(input || 0)/100).toFixed(2);
        if(mode==="LOGIN") document.getElementById('login-input-ui').innerText = input;
    }

    function openMemberSearch() {
        showModal(`
            <div class="menu-inner">
                <h3>SYÖTÄ JÄSEN-ID NUMPADILLA JA VALITSE VALMIS</h3>
                <button class="menu-btn-large" onclick="findMem()">VALMIS</button>
            </div>
        `);
    }

    function findMem() {
        let m = db.members.find(x => x.id === input);
        if (m) { currentMember = m; closeModals(); updateReceipt(); }
        else { alert("Ei löytynyt."); input=""; updateDisplay(); }
    }

    function openPayment() {
        if (cart.length === 0) return;
        showModal(`
            <div class="menu-inner">
                <h1>YHTEENSÄ: ${document.getElementById('total-display').innerText}€</h1>
                <button class="menu-btn-large" onclick="finish('KÄTEINEN')">KÄTEINEN</button>
                <button class="menu-btn-large" onclick="finish('KORTTI')">KORTTI</button>
            </div>
        `);
    }

    function finish(m) {
        alert("Myynti valmis: " + m);
        cart = []; currentMember = null; updateReceipt(); closeModals();
    }
</script>
</body>
</html>
