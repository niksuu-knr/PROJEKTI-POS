<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-RAUTA POS v14.0 - FINAL MASTER</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1; --danger: #cc0000; --success: #28a745; --terminal-green: #0f0; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { background: var(--k-blue); color: white; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 3px solid var(--k-orange); }
        
        .main-container { display: flex; flex: 1; gap: 5px; padding: 5px; height: calc(100vh - 55px); }
        .left-panel { width: 450px; display: flex; flex-direction: column; gap: 5px; }
        .receipt-area { flex: 1; background: white; border: 1px solid #888; display: flex; flex-direction: column; overflow: hidden; border-radius: 4px; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 10px; font-size: 0.95rem; }
        .receipt-row { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
        .receipt-row.selected { background: var(--k-blue) !important; color: white; }
        .receipt-row.voided { text-decoration: line-through; color: var(--danger); opacity: 0.5; }
        .price-tag { font-weight: bold; }
        .price-mod { color: var(--k-orange); font-size: 0.75rem; display: block; }

        .total-container { background: #f0f0f0; border-top: 2px solid #ccc; padding: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 2.8rem; font-weight: bold; color: var(--k-blue); }
        .input-display { background: #1a1a1a; color: var(--terminal-green); padding: 10px; text-align: right; font-size: 3rem; font-family: 'Courier New', monospace; border: 4px inset #555; height: 75px; overflow: hidden; }

        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .product-display { flex: 4; background: #e0e0e0; border: 1px solid #bbb; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 100px; gap: 10px; overflow-y: auto; }
        .category-bar { flex: 0.8; background: #bcbcbc; display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 5px; padding: 5px; }
        .grid-item { background: white; border: 1px solid #999; border-bottom: 5px solid var(--k-blue); font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.85rem; padding: 5px; box-shadow: 2px 2px 0 rgba(0,0,0,0.1); }
        .cat-item { background: var(--k-blue); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; text-align: center; border: 1px solid #555; }
        .cat-item.active { background: var(--k-orange); }
        
        .right-panel { width: 170px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 3px; }
        .f-btn { background: #eee; border: 1px solid #777; font-size: 0.8rem; font-weight: bold; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 1rem; }
        .f-btn:active { background: #ccc; }
        .f-btn.orange { background: var(--k-orange); color: white; }
        .f-btn.orange span { color: white; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: #fff; width: 90%; height: 90vh; border: 8px solid var(--k-blue); display: flex; flex-direction: column; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; height: 100%; }
        .admin-menu { border-right: 2px solid #ccc; display: flex; flex-direction: column; gap: 10px; }
        .admin-view { overflow-y: auto; padding: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #eee; position: sticky; top: 0; }

        .login-screen { position: fixed; inset: 0; background: var(--k-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body onload="init()">

<div id="login-screen" class="login-screen">
    <h1 style="font-size: 5rem; margin-bottom: 20px;">K-RAUTA</h1>
    <div style="background:white; color:black; padding:20px 60px; font-size:4rem; border:10px solid var(--k-orange);" id="login-input-ui">****</div>
    <p style="font-size: 1.5rem; margin-top: 20px;">SYÖTÄ MYYJÄNUMERO (esim. 4422)</p>
</div>

<header>
    <div id="header-receipt">KUITTI: #----</div>
    <div id="header-member" style="color:var(--k-orange);">TARJOUSASIAKAS: EI</div>
    <div id="header-seller">MYYJÄ: -</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-container">
                <div class="total-row"><span>YHTEENSÄ</span><span id="total-display">0.00</span></div>
            </div>
        </div>
        <div class="input-display" id="pos-input-display">0.00</div>
        <div id="numpad-ui" style="display:grid; grid-template-columns:repeat(4,1fr); gap:3px;"></div>
    </div>
    
    <div class="center-panel">
        <div class="product-display" id="product-grid"></div>
        <div class="category-bar" id="category-grid"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="handleFKey('F1')"><span>F1</span>PALAUTUS</div>
        <div class="f-btn" onclick="handleFKey('F2')"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="handleFKey('F3')"><span>F3</span>HAE JÄSEN</div>
        <div class="f-btn" onclick="handleFKey('F4')"><span>F4</span>UUSI JÄSEN</div>
        <div class="f-btn" onclick="handleFKey('F5')"><span>F5</span>ALENNUS-%</div>
        <div class="f-btn orange" onclick="changePrice()"><span>/</span>HINNAN MUUTOS</div>
        <div class="f-btn" onclick="handleFKey('F6')"><span>F6</span>POISTA RIVI</div>
        <div class="f-btn" onclick="handleFKey('F11')"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn" style="background:var(--success); color:white;" onclick="handleFKey('F12')"><span>F12</span>MAKSA (+)</div>
    </div>
</div>

<div id="main-modal" class="modal"><div class="modal-content" id="modal-content"></div></div>

<script>
    // --- DATABASE ---
    let db = JSON.parse(localStorage.getItem('krauta_v14_db')) || {
        products: [
            {id: "101", name: "VASARA PRO", price: 29.90, mPrice: 22.00, cat: "TYÖKALUT"},
            {id: "202", name: "RUUVIPAKKI", price: 15.50, mPrice: 12.00, cat: "PIHA"},
            {id: "GIFT", name: "LAHJAKORTTI LADATTAVA", price: 0, mPrice: 0, cat: "LAHJAKORTIT"}
        ],
        categories: ["TYÖKALUT", "PIHA", "LAHJAKORTIT"],
        sellers: [{id: "4422", name: "Matti K."}],
        members: [{id: "100", name: "Kalle Kanta"}],
        giftcards: [],
        salesHistory: [],
        nextReceipt: 10001
    };

    function save() { localStorage.setItem('krauta_v14_db', JSON.stringify(db)); }

    // --- STATE ---
    let cart = [];
    let input = "";
    let multiplier = 1;
    let mode = "LOGIN"; 
    let selectedIdx = -1;
    let currentMember = null;
    let currentCat = "TYÖKALUT";

    function init() {
        renderCategories(); renderProducts(); renderNumpad();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
        updateReceiptHeader();
    }

    // --- KEYBOARD LOGIC ---
    window.addEventListener('keydown', e => {
        if (e.key.startsWith('F') || e.key === '*' || e.key === '/' || e.key.startsWith('Arrow')) e.preventDefault();
        
        if (mode === "SALE") {
            if (e.key === 'ArrowUp') { selectedIdx = Math.max(0, selectedIdx - 1); updateReceipt(); return; }
            if (e.key === 'ArrowDown') { selectedIdx = Math.min(cart.length - 1, selectedIdx + 1); updateReceipt(); return; }
            if (e.key === '/') { changePrice(); return; }
        }

        if (e.key === '*') { multiplier = parseFloat(input.replace(',', '.')) || 1; input = ""; updateDisplay(); return; }
        if (e.key.startsWith('F')) { handleFKey(e.key); return; }
        if (e.key === 'Enter') { handleEnter(); return; }
        if (e.key === 'Backspace') { input = input.slice(0, -1); updateDisplay(); }
        if (e.key === 'Escape') { closeModals(); }
        if (!isNaN(e.key) || e.key === ',') { input += e.key; updateDisplay(); }
    });

    function handleEnter() {
        if (mode === "LOGIN") {
            let s = db.sellers.find(x => x.id === input);
            if (s) { mode="SALE"; document.getElementById('login-screen').style.display="none"; document.getElementById('header-seller').innerText = "MYYJÄ: " + s.name; }
            else { alert("VÄÄRÄ MYYJÄNUMERO"); }
        } else {
            let p = db.products.find(x => x.id === input);
            if (p) addToCart(p);
            else if(input !== "") alert("TUOTETTA EI LÖYDY");
        }
        input = ""; updateDisplay();
    }

    function handleFKey(key) {
        if (mode === "LOGIN") return;
        if (key === 'F1') {
            let rNo = prompt("Syötä palautettavan kuitin numero:");
            let old = db.salesHistory.find(s => s.receiptNo == rNo);
            if(old) { cart = old.items.map(i => ({...i, qty: -i.qty})); updateReceipt(); }
        }
        if (key === 'F2') openAdmin();
        if (key === 'F3') {
            let id = prompt("Syötä jäsennumero:");
            let m = db.members.find(x => x.id === id);
            if(m) { currentMember = m; applyMemberPrices(); }
        }
        if (key === 'F4') {
            let id = prompt("Uusi jäsennumero:");
            let name = prompt("Nimi:");
            if(id && name) { db.members.push({id, name}); save(); currentMember = {id, name}; applyMemberPrices(); }
        }
        if (key === 'F5') {
            if(selectedIdx > -1) {
                let perc = parseFloat(prompt("Anna alennusprosentti (1-99):"));
                if(!isNaN(perc)) { cart[selectedIdx].price *= (1 - perc/100); cart[selectedIdx].manualPrice = true; updateReceipt(); }
            }
        }
        if (key === 'F6') { if(selectedIdx > -1) { cart[selectedIdx].voided = !cart[selectedIdx].voided; updateReceipt(); } }
        if (key === 'F11') { if(confirm("Mitätöidäänkö koko kuitti?")) { cart=[]; currentMember=null; updateReceipt(); } }
        if (key === 'F12') openPayment();
    }

    // --- POS ACTIONS ---
    function addToCart(p) {
        let price = currentMember ? p.mPrice : p.price;
        if (p.id === "GIFT") {
            let code = prompt("Uuden lahjakortin numero:");
            let val = multiplier > 1 ? multiplier : parseFloat(prompt("Ladattava summa:"));
            if(code && val) cart.push({ ...p, name: "LAHJAKORTTI: " + code, price: val, qty: 1, giftCode: code });
        } else {
            cart.push({...p, price: price, qty: multiplier, voided: false});
        }
        multiplier = 1; selectedIdx = cart.length - 1; updateReceipt();
    }

    function changePrice() {
        if (selectedIdx === -1 || !input) return;
        let newPrice = parseFloat(input.replace(',', '.'));
        if (!isNaN(newPrice)) {
            cart[selectedIdx].price = newPrice;
            cart[selectedIdx].manualPrice = true;
            input = ""; updateReceipt(); updateDisplay();
        }
    }

    function applyMemberPrices() {
        cart.forEach(item => {
            let p = db.products.find(x => x.id === item.id);
            if(p && !item.manualPrice) item.price = p.mPrice;
        });
        updateReceipt();
    }

    function updateReceipt() {
        const list = document.getElementById('receipt-list'); list.innerHTML = ""; let total = 0;
        cart.forEach((item, i) => {
            let line = item.voided ? 0 : (item.price * item.qty);
            list.innerHTML += `<div class="receipt-row ${selectedIdx===i?'selected':''} ${item.voided?'voided':''}" onclick="selectedIdx=${i};updateReceipt();">
                <div>
                    <span>${item.qty}x ${item.name}</span>
                    ${item.manualPrice ? '<span class="price-mod">MUUTETTU HINTA</span>' : ''}
                </div>
                <span class="price-tag">${line.toFixed(2)}€</span>
            </div>`;
            total += line;
        });
        document.getElementById('total-display').innerText = total.toFixed(2);
        document.getElementById('header-member').innerText = currentMember ? "TARJOUSASIAKAS: " + currentMember.name : "TARJOUSASIAKAS: EI";
    }

    // --- PAYMENT ---
    function openPayment() {
        let total = parseFloat(document.getElementById('total-display').innerText);
        if (total <= 0) return;
        showModal(`
            <h1 style="text-align:center; font-size:3rem;">MAKSU: ${total.toFixed(2)}€</h1>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:40px;">
                <button onclick="finishSale('KÄTEINEN/KORTTI')" style="height:150px; font-size:2rem; background:var(--success); color:white;">KORTTI / KÄTEINEN</button>
                <button onclick="payGiftCard()" style="height:150px; font-size:2rem; background:var(--k-orange); color:white;">LAHJAKORTTI</button>
            </div>
            <button onclick="closeModals()" style="margin-top:20px; padding:15px;">PERUUTA</button>
        `);
    }

    function payGiftCard() {
        let code = prompt("Syötä lahjakortin koodi:");
        let gc = db.giftcards.find(g => g.code === code);
        if(gc) {
            let total = parseFloat(document.getElementById('total-display').innerText);
            if(gc.balance >= total) { gc.balance -= total; finishSale("LAHJAKORTTI: " + code); }
            else { alert("Saldo ei riitä! Saldo: " + gc.balance.toFixed(2) + "€"); }
        } else { alert("Lahjakorttia ei löydy!"); }
    }

    function finishSale(method) {
        // Create new gift cards if sold
        cart.forEach(item => {
            if(item.giftCode && !item.voided) {
                db.giftcards.push({code: item.giftCode, balance: item.price});
            }
        });
        db.salesHistory.push({ receiptNo: db.nextReceipt++, items: [...cart], total: parseFloat(document.getElementById('total-display').innerText), method, time: new Date().toLocaleString() });
        save(); cart = []; currentMember = null; updateReceipt(); closeModals(); updateReceiptHeader();
    }

    // --- ADMIN ---
    function openAdmin() {
        mode = "ADMIN";
        showModal(`
            <div class="admin-grid">
                <div class="admin-menu">
                    <button onclick="adminView('PRODUCTS')" style="padding:15px;">TUOTTEET</button>
                    <button onclick="adminView('GIFTS')" style="padding:15px;">LAHJAKORTIT</button>
                    <button onclick="adminView('HISTORY')" style="padding:15px;">MYYNTIHISTORIA</button>
                    <button onclick="closeModals()" style="padding:15px; margin-top:auto; background:var(--danger); color:white;">SULJE</button>
                </div>
                <div class="admin-view" id="admin-view-content">Valitse toiminto</div>
            </div>
        `);
    }

    function adminView(v) {
        let area = document.getElementById('admin-view-content');
        if(v === 'PRODUCTS') {
            area.innerHTML = `<h3>TUOTELISTA</h3><table><tr><th>ID</th><th>NIMI</th><th>HINTA</th><th>M-HINTA</th></tr>
                ${db.products.map(p => `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.price}</td><td>${p.mPrice}</td></tr>`).join('')}</table>`;
        }
        if(v === 'GIFTS') {
            area.innerHTML = `<h3>AKTIIVISET LAHJAKORTIT</h3><table><tr><th>KOODI</th><th>SALDO</th></tr>
                ${db.giftcards.map(g => `<tr><td>${g.code}</td><td>${g.balance.toFixed(2)}€</td></tr>`).join('')}</table>`;
        }
        if(v === 'HISTORY') {
            area.innerHTML = `<h3>MYYNTILOKI</h3><table><tr><th>KUITTI</th><th>SUMMA</th><th>TAPA</th><th>AIKA</th></tr>
                ${db.salesHistory.slice().reverse().map(s => `<tr><td>#${s.receiptNo}</td><td>${s.total.toFixed(2)}€</td><td>${s.method}</td><td>${s.time}</td></tr>`).join('')}</table>`;
        }
    }

    // --- UI HELPERS ---
    function renderProducts() {
        document.getElementById('product-grid').innerHTML = db.products.filter(p => p.cat === currentCat).map(p => 
            `<div class="grid-item" onclick='addToCart(${JSON.stringify(p)})'><b>${p.name}</b><br>${(currentMember ? p.mPrice : p.price).toFixed(2)}€</div>`).join('');
    }

    function renderCategories() {
        document.getElementById('category-grid').innerHTML = db.categories.map(c => 
            `<div class="cat-item ${currentCat===c?'active':''}" onclick="currentCat='${c}';renderCategories();renderProducts();">${c}</div>`).join('');
    }

    function renderNumpad() {
        ['7','8','9','CLR','4','5','6','*','1','2','3','ENT','0','00',',','/'].forEach(k => {
            let b = document.createElement('button'); b.className = "f-btn"; b.style.height="65px"; b.innerText = k;
            if(k==='/') { b.style.background="var(--k-orange)"; b.style.color="white"; }
            b.onclick = () => { 
                if(k==='ENT') handleEnter(); else if(k==='/') changePrice();
                else if(k==='CLR') { input=""; multiplier=1; updateDisplay(); } 
                else if(k==='*') { multiplier=parseFloat(input.replace(',','.'))||1; input=""; updateDisplay(); } 
                else { input += k; updateDisplay(); } 
            };
            document.getElementById('numpad-ui').appendChild(b);
        });
    }

    function showModal(h) { document.getElementById('modal-content').innerHTML = h; document.getElementById('main-modal').style.display="flex"; }
    function closeModals() { document.getElementById('main-modal').style.display="none"; mode="SALE"; }
    function updateReceiptHeader() { document.getElementById('header-receipt').innerText = "KUITTI: #" + db.nextReceipt; }
    function updateDisplay() { 
        document.getElementById('pos-input-display').innerText = (multiplier !== 1 ? multiplier + "x " : "") + (input || "0.00"); 
        if(mode==="LOGIN") document.getElementById('login-input-ui').innerText = input.split('').map(()=>'*').join('') || "****"; 
    }
</script>
</body>
</html>
