<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>KASSAOHJELMA</title>
    <style>
        :root {
            --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1;
            --border-color: #888; --danger: #cc0000; --success: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { background: var(--k-blue); color: white; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; height: 40px; font-weight: bold; }
        .main-container { display: flex; flex: 1; gap: 5px; padding: 5px; height: calc(100vh - 75px); }

        /* Kuittialue */
        .left-panel { width: 380px; display: flex; flex-direction: column; }
        .receipt-area { flex: 1; background: white; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .receipt-info { background: #eee; padding: 5px; font-size: 0.8rem; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 5px; font-size: 0.85rem; }
        .receipt-row { padding: 6px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
        .receipt-row.selected { background: var(--k-orange); color: white; }
        .row-main { display: flex; justify-content: space-between; font-weight: bold; }
        .row-details { font-size: 0.75rem; color: #666; font-style: italic; }
        .selected .row-details { color: white; }
        
        .total-row { display: flex; justify-content: space-between; font-size: 2.2rem; font-weight: bold; color: var(--k-blue); padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }
        .input-display { background: #1a1a1a; color: #0f0; padding: 10px; text-align: right; font-size: 2rem; font-family: monospace; margin: 5px 0; height: 45px; display: flex; justify-content: space-between; align-items: center; border: 2px inset #555; }
        #mode-label { font-size: 0.8rem; color: #ff0; text-transform: uppercase; }

        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #bbb; padding: 5px; }
        .num-btn { height: 55px; background: #fefefe; border: 1px solid #777; font-size: 1.3rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-btn.blue { background: var(--k-blue); color: white; }
        .num-btn.orange { background: var(--k-orange); color: white; }

        /* Keskipaneeli */
        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px; }
        .grid-btn { background: white; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-weight: bold; cursor: pointer; font-size: 0.8rem; padding: 5px; }
        .grid-btn.category { background: #eee; border-left: 5px solid var(--k-blue); }

        /* Oikea paneeli */
        .right-panel { width: 180px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #eee; border: 1px solid #777; font-size: 0.75rem; font-weight: bold; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 0.85rem; }
        .f-btn.success { background: var(--success); color: white; }
        .f-btn.danger { background: var(--danger); color: white; }

        /* Hallinta-Modaali */
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border: 4px solid var(--k-blue); width: 600px; max-height: 80vh; overflow-y: auto; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .admin-nav button { flex: 1; padding: 10px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; font-weight: bold; }
        .admin-nav button.active { background: var(--k-blue); color: white; border-color: var(--k-blue); }
        .admin-list { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .admin-list th, .admin-list td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .admin-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f0f0f0; padding: 15px; margin-bottom: 20px; }
        .admin-form input, .admin-form select { padding: 8px; border: 1px solid #ccc; }
        .btn-row { display: flex; gap: 5px; }
        .small-btn { padding: 4px 8px; cursor: pointer; font-size: 0.7rem; border: none; color: white; }
        .edit-btn { background: var(--k-blue); }
        .del-btn { background: var(--danger); }
    </style>
</head>
<body onload="init()">

<header>
    <div>KASSA</div>
    <div id="seller-display">MYYJÄ: -</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-info">
                <span id="receipt-no-display">KUITTI: -</span>
                <span id="receipt-date"></span>
            </div>
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-row">
                <span>YHTEENSÄ</span> 
                <span id="total-display">0.00</span>
            </div>
        </div>
        <div class="input-display">
            <span id="mode-label">MYYNTI</span>
            <span id="pos-input">0</span>
        </div>
        <div class="numpad">
            <div class="num-btn" onclick="uiPress('7')">7</div><div class="num-btn" onclick="uiPress('8')">8</div><div class="num-btn" onclick="uiPress('9')">9</div><div class="num-btn blue" onclick="setQty()">KPL</div>
            <div class="num-btn" onclick="uiPress('4')">4</div><div class="num-btn" onclick="uiPress('5')">5</div><div class="num-btn" onclick="uiPress('6')">6</div><div class="num-btn blue" onclick="executeSearch()">HAE</div>
            <div class="num-btn" onclick="uiPress('1')">1</div><div class="num-btn" onclick="uiPress('2')">2</div><div class="num-btn" onclick="uiPress('3')">3</div><div class="num-btn orange" onclick="clearInput()">CLR</div>
            <div class="num-btn" onclick="uiPress('0')">0</div><div class="num-btn" onclick="uiPress('00')">00</div><div class="num-btn" onclick="uiPress('.')">,</div><div class="num-btn orange" onclick="handleEnter()">ENT</div>
        </div>
    </div>

    <div class="center-panel">
        <div class="grid-container" id="grid-main"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="executeSearch()"><span>F1</span>TUOTEHAKU</div>
        <div class="f-btn" onclick="openAdmin()"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="togglePlussa()"><span>F3</span>K-PLUSSA</div>
        <div class="f-btn" onclick="setMode('DISCOUNT')"><span>F5</span>ALE %</div>
        <div class="f-btn" onclick="removeRow()"><span>F6</span>RIVIN POISTO</div>
        <div class="f-btn" onclick="openReturnMenu()"><span>F7</span>PALAUTUS</div>
        <div class="f-btn" onclick="setMode('PRICE_CHANGE')"><span>F8</span>HINNAN MUUTOS</div>
        <div class="f-btn danger" onclick="voidSale()"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn success" onclick="openPayMenu()"><span>F12</span>MAKSA</div>
    </div>
</div>

<!-- HALLINTA MODAALI -->
<div id="admin-modal" class="modal">
    <div class="modal-content">
        <div class="admin-nav">
            <button id="nav-products" onclick="switchAdminTab('products')" class="active">TUOTTEET</button>
            <button id="nav-categories" onclick="switchAdminTab('categories')">TUOTERYHMÄT</button>
            <button id="nav-sellers" onclick="switchAdminTab('sellers')">MYYJÄT</button>
        </div>

        <div id="admin-view">
            <!-- Dynaaminen sisältö -->
        </div>

        <button class="num-btn orange" style="width:100%; margin-top:20px" onclick="closeModals()">SULJE HALLINTA</button>
    </div>
</div>

<script>
    // DATA
    let products = JSON.parse(localStorage.getItem('pos_products')) || {
        "101": { name: "KESTOPUU 28x95", price: 2.25, cat: "PUUTAVARA" },
        "201": { name: "SEMENTTI S30", price: 8.90, cat: "LASTIT" }
    };
    let categories = JSON.parse(localStorage.getItem('pos_categories')) || ["PUUTAVARA", "LASTIT", "TYÖKALUT"];
    let sellers = JSON.parse(localStorage.getItem('pos_sellers')) || { "4422": "Matti Meikäläinen", "1234": "Kassatyöntekijä" };
    let salesHistory = {};
    let lastReceiptNum = 50000;

    let cart = [];
    let input = "";
    let mode = "SALE";
    let selectedIdx = -1;
    let currentQty = 1;
    let currentSeller = "4422";
    let adminTab = "products";

    function init() {
        updateSellerDisplay();
        renderCategories();
        newReceipt();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
    }

    function updateSellerDisplay() {
        document.getElementById('seller-display').innerText = `MYYJÄ: ${currentSeller} (${sellers[currentSeller] || 'Tuntematon'})`;
    }

    function newReceipt() {
        lastReceiptNum++;
        document.getElementById('receipt-no-display').innerText = "KUITTI: " + lastReceiptNum;
        document.getElementById('receipt-date').innerText = new Date().toLocaleDateString('fi-FI');
        renderCategories();
    }

    // PÄÄVALIKKO (Tuoteryhmät)
    function renderCategories() {
        const grid = document.getElementById('grid-main');
        grid.innerHTML = "";
        categories.forEach(cat => {
            const btn = document.createElement('div');
            btn.className = 'grid-btn category';
            btn.innerText = cat;
            btn.onclick = () => renderProducts(cat);
            grid.appendChild(btn);
        });
    }

    function renderProducts(cat) {
        const grid = document.getElementById('grid-main');
        grid.innerHTML = "";
        const back = document.createElement('div');
        back.className = 'grid-btn orange';
        back.innerText = "<< TAKAISIN";
        back.onclick = renderCategories;
        grid.appendChild(back);

        Object.keys(products).forEach(id => {
            if(products[id].cat === cat) {
                const btn = document.createElement('div');
                btn.className = 'grid-btn';
                btn.innerHTML = `${products[id].name}<br>${products[id].price.toFixed(2)}€`;
                btn.onclick = () => addToCart(id);
                grid.appendChild(btn);
            }
        });
    }

    function addToCart(id) {
        const p = products[id];
        const lastItem = cart[cart.length - 1];
        if (lastItem && lastItem.id === id && !lastItem.isChanged) {
            lastItem.qty += currentQty;
        } else {
            cart.push({ ...p, id: id, qty: currentQty, originalPrice: p.price, discountPercent: 0, isChanged: false });
        }
        currentQty = 1;
        updateReceipt();
    }

    function updateReceipt() {
        const list = document.getElementById('receipt-list');
        list.innerHTML = "";
        let total = 0;
        cart.forEach((item, i) => {
            const row = document.createElement('div');
            row.className = `receipt-row ${selectedIdx === i ? 'selected' : ''}`;
            row.innerHTML = `<div class="row-main"><span>${item.qty} x ${item.name}</span><span>${(item.price * item.qty).toFixed(2)}</span></div>`;
            row.onclick = () => { selectedIdx = i; updateReceipt(); };
            list.appendChild(row);
            total += (item.price * item.qty);
        });
        document.getElementById('total-display').innerText = total.toFixed(2);
    }

    // HALLINTA-LOGIIKKA
    function openAdmin() {
        document.getElementById('admin-modal').style.display = 'flex';
        switchAdminTab('products');
    }

    function switchAdminTab(tab) {
        adminTab = tab;
        document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('nav-' + tab).classList.add('active');
        renderAdminView();
    }

    function renderAdminView() {
        const view = document.getElementById('admin-view');
        if(adminTab === 'products') {
            let options = categories.map(c => `<option value="${c}">${c}</option>`).join("");
            view.innerHTML = `
                <div class="admin-form">
                    <input type="text" id="p-id" placeholder="PLU/ID">
                    <input type="text" id="p-name" placeholder="Tuotenimi">
                    <input type="number" id="p-price" step="0.01" placeholder="Hinta">
                    <select id="p-cat">${options}</select>
                    <button class="num-btn blue" onclick="addEditProduct()">LISÄÄ / PÄIVITÄ</button>
                </div>
                <table class="admin-list">
                    <tr><th>ID</th><th>Nimi</th><th>Hinta</th><th>Ryhmä</th><th>Toiminnot</th></tr>
                    ${Object.keys(products).map(id => `
                        <tr>
                            <td>${id}</td><td>${products[id].name}</td><td>${products[id].price}</td><td>${products[id].cat}</td>
                            <td><button class="small-btn del-btn" onclick="deleteProduct('${id}')">POISTA</button></td>
                        </tr>`).join("")}
                </table>`;
        } else if(adminTab === 'categories') {
            view.innerHTML = `
                <div class="admin-form">
                    <input type="text" id="c-name" placeholder="Uusi tuoteryhmä">
                    <button class="num-btn blue" onclick="addCategory()">LISÄÄ</button>
                </div>
                <table class="admin-list">
                    <tr><th>Nimi</th><th>Toiminnot</th></tr>
                    ${categories.map(c => `<tr><td>${c}</td><td><button class="small-btn del-btn" onclick="deleteCategory('${c}')">POISTA</button></td></tr>`).join("")}
                </table>`;
        } else if(adminTab === 'sellers') {
            view.innerHTML = `
                <div class="admin-form">
                    <input type="text" id="s-id" placeholder="Myyjänumero">
                    <input type="text" id="s-name" placeholder="Nimi">
                    <button class="num-btn blue" onclick="addSeller()">LISÄÄ</button>
                </div>
                <table class="admin-list">
                    <tr><th>ID</th><th>Nimi</th><th>Toiminnot</th></tr>
                    ${Object.keys(sellers).map(id => `<tr><td>${id}</td><td>${sellers[id]}</td><td><button class="small-btn del-btn" onclick="deleteSeller('${id}')">POISTA</button></td></tr>`).join("")}
                </table>`;
        }
    }

    // DATA-FUNKTIOT
    function addEditProduct() {
        const id = document.getElementById('p-id').value;
        if(!id) return;
        products[id] = {
            name: document.getElementById('p-name').value,
            price: parseFloat(document.getElementById('p-price').value),
            cat: document.getElementById('p-cat').value
        };
        saveAndRefresh();
    }
    function deleteProduct(id) { delete products[id]; saveAndRefresh(); }
    
    function addCategory() {
        const name = document.getElementById('c-name').value;
        if(name && !categories.includes(name)) categories.push(name.toUpperCase());
        saveAndRefresh();
    }
    function deleteCategory(name) { 
        categories = categories.filter(c => c !== name);
        saveAndRefresh();
    }

    function addSeller() {
        const id = document.getElementById('s-id').value;
        const name = document.getElementById('s-name').value;
        if(id && name) sellers[id] = name;
        saveAndRefresh();
    }
    function deleteSeller(id) { delete sellers[id]; saveAndRefresh(); }

    function saveAndRefresh() {
        localStorage.setItem('pos_products', JSON.stringify(products));
        localStorage.setItem('pos_categories', JSON.stringify(categories));
        localStorage.setItem('pos_sellers', JSON.stringify(sellers));
        renderAdminView();
        renderCategories();
        updateSellerDisplay();
    }

    // PERUSTOIMINNOT
    function handleEnter() {
        if(mode === "SALE") {
            if(products[input]) { addToCart(input); clearInput(); }
            else if(sellers[input]) { currentSeller = input; updateSellerDisplay(); clearInput(); }
            else if(input === "") openPayMenu();
        }
        else if(mode === "PRICE_CHANGE" && selectedIdx > -1) {
            cart[selectedIdx].price = parseFloat(input)/100; cart[selectedIdx].isChanged = true;
            setMode('SALE'); clearInput(); updateReceipt();
        }
        else if(mode === "DISCOUNT" && selectedIdx > -1) {
            let d = parseInt(input); cart[selectedIdx].price *= (1 - d/100);
            setMode('SALE'); clearInput(); updateReceipt();
        }
    }

    function openPayMenu() { alert("Maksu suoritettu!"); cart=[]; updateReceipt(); newReceipt(); }
    function uiPress(n) { input += n; updateDisplay(); }
    function updateDisplay() { document.getElementById('pos-input').innerText = (input.length > 4) ? input : (parseInt(input || 0) / 100).toFixed(2); }
    function clearInput() { input = ""; updateDisplay(); }
    function setMode(m) { mode = m; document.getElementById('mode-label').innerText = m; }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
    function voidSale() { cart = []; updateReceipt(); newReceipt(); }
    function setQty() { currentQty = parseInt(input) || 1; clearInput(); }
    function removeRow() { if(selectedIdx > -1) { cart.splice(selectedIdx, 1); selectedIdx = -1; updateReceipt(); } }
    function executeSearch() { if(products[input]) { addToCart(input); clearInput(); } }
</script>
</body>
</html>
