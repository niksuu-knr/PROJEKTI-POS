<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>KASSA</title>
    <style>
        :root {
            --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1;
            --border-color: #888; --danger: #cc0000; --success: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: var(--k-blue); color: white; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; height: 40px; font-weight: bold; }
        .main-container { display: flex; flex: 1; gap: 5px; padding: 5px; height: calc(100vh - 75px); }

        /* Vasen paneeli[cite: 2] */
        .left-panel { width: 380px; display: flex; flex-direction: column; }
        .receipt-area { flex: 1; background: white; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .receipt-header { background: #444; color: white; padding: 8px; text-align: center; font-weight: bold; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 5px; font-size: 0.9rem; }
        .receipt-row { display: flex; justify-content: space-between; padding: 4px 8px; }
        
        /* Vaihtorahan näyttö yhteensä-kohdassa */
        .total-row { display: flex; justify-content: space-between; font-size: 2.2rem; font-weight: bold; color: var(--k-blue); padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; transition: all 0.3s; }
        .total-row.change-mode { color: var(--danger); background: #fff3f3; }

        .input-display { background: #1a1a1a; color: #0f0; padding: 10px; text-align: right; font-size: 2rem; font-family: monospace; margin: 5px 0; height: 45px; display: flex; justify-content: space-between; align-items: center; }
        #mode-label { font-size: 0.8rem; color: #ff0; }

        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #bbb; padding: 5px; }
        .num-btn { height: 65px; background: #fefefe; border: 1px solid #777; font-size: 1.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-btn.blue { background: var(--k-blue); color: white; }
        .num-btn.orange { background: var(--k-orange); color: white; }

        /* Keskipaneeli[cite: 2] */
        .center-panel { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: auto repeat(5, 1fr); gap: 5px; padding-top: 55px; }
        .product-btn { background: white; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; text-align: center; font-weight: bold; cursor: pointer; }

        /* Oikea paneeli */
        .right-panel { width: 180px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #eee; border: 1px solid #777; font-size: 0.8rem; font-weight: bold; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); }

        /* Lukitusruutu[cite: 2] */
        #lock-screen { position: fixed; top: 40px; left: 0; width: 100%; height: calc(100% - 40px); background: rgba(0,0,0,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
    </style>
</head>
<body>

<header>
    <div>K-RAUTA POS - MYYMÄLÄ 101</div>
    <div id="seller-info">MYYJÄ: EI KIRJAUTUNUT</div>
    <div id="clock">19:23:43</div>
</header>

<!-- Lukitusruutu[cite: 2] -->
<div id="lock-screen">
    <h1 style="color: var(--k-orange);">KASSA LUKITTU</h1>
    <p>SYÖTÄ MYYJÄNUMERO JA PAINA ENT</p>
    <div id="login-display" style="font-size: 3rem; background: #222; padding: 20px; min-width: 200px; text-align: center; border: 2px solid var(--k-orange);">****</div>
</div>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-header">VOIMASSA OLEVA TAPAHTUMA</div>
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-row" id="total-container">
                <span id="total-label">YHTEENSÄ</span> 
                <span id="total-display">0.00</span>
            </div>
        </div>
        <div class="input-display">
            <span id="mode-label">MYYNTI</span>
            <span id="pos-input">0</span>
        </div>
        <div class="numpad">
            <div class="num-btn" onclick="press('7')">7</div><div class="num-btn" onclick="press('8')">8</div><div class="num-btn" onclick="press('9')">9</div><div class="num-btn blue" onclick="setQty()">KPL</div>
            <div class="num-btn" onclick="press('4')">4</div><div class="num-btn" onclick="press('5')">5</div><div class="num-btn" onclick="press('6')">6</div><div class="num-btn blue">HAE</div>
            <div class="num-btn" onclick="press('1')">1</div><div class="num-btn" onclick="press('2')">2</div><div class="num-btn" onclick="press('3')">3</div><div class="num-btn orange" onclick="clearInput()">CLR</div>
            <div class="num-btn" onclick="press('0')">0</div><div class="num-btn" onclick="press('00')">00</div><div class="num-btn" onclick="press('.')">,</div><div class="num-btn orange" onclick="handleEnter()">ENT</div>
        </div>
    </div>

    <div class="center-panel" id="product-grid"></div>

    <div class="right-panel">
        <div class="f-btn"><span>F1</span>TUOTEHAKU</div>
        <div class="f-btn"><span>F2</span>PLU-LISTA</div>
        <div class="f-btn"><span>F3</span>K-PLUSSA</div>
        <div class="f-btn" onclick="lockPOS()"><span>F4</span>MYYJÄ (LUKITSE)</div>
        <div class="f-btn" onclick="removeSelected()"><span>F6</span>RIVIN POISTO</div>
        <div class="f-btn" onclick="setPriceMode()"><span>F8</span>HINNAN MUUTOS</div>
        <div class="f-btn" style="background:var(--success); color:white;" onclick="openPayMenu()"><span>F12</span>MAKSA</div>
    </div>
</div>

<div id="pay-modal" class="modal">
    <div style="background:white; padding:20px; border:4px solid var(--k-blue); width:350px;">
        <h2 style="text-align:center;">MAKSU</h2>
        <button class="num-btn" style="width:100%; margin-bottom:10px" onclick="setCashMode()">F1 - KÄTEINEN</button>
        <button class="num-btn orange" style="width:100%" onclick="closeModals()">PERUUTA</button>
    </div>
</div>

<script>
    let cart = [];
    let input = "";
    let mode = "LOGIN"; // LOGIN, SALE, CASH, PRICE[cite: 2]
    let currentSeller = "";
    let lastChange = 0;

    const products = [
        { id: "101", name: "KESTOPUU 28x95", price: 2.25 },
        { id: "202", name: "SEMENTTI S30", price: 8.90 }
    ];

    function init() {
        const grid = document.getElementById('product-grid');
        for(let i=0; i<20; i++) {
            const btn = document.createElement('div');
            btn.className = 'product-btn';
            if(products[i]) {
                btn.innerHTML = `${products[i].name}<br>${products[i].price.toFixed(2)}€`;
                btn.onclick = () => addToCart(products[i]);
            } else { btn.innerHTML = "---"; btn.style.color = "#ccc"; }
            grid.appendChild(btn);
        }
    }

    function press(n) {
        input += n;
        if(mode === "LOGIN") {
            document.getElementById('login-display').innerText = "*".repeat(input.length);
        } else {
            document.getElementById('pos-input').innerText = formatInput(input);
        }
    }

    function formatInput(str) {
        if(!str) return "0";
        return (parseInt(str) / 100).toLocaleString('fi-FI', {minimumFractionDigits: 2});
    }

    function clearInput() { input = ""; document.getElementById('pos-input').innerText = "0"; if(mode==="LOGIN") document.getElementById('login-display').innerText = ""; }

    function handleEnter() {
        if(mode === "LOGIN") {
            if(input.length >= 4) {
                currentSeller = input;
                document.getElementById('seller-info').innerText = "MYYJÄ: " + currentSeller;
                document.getElementById('lock-screen').style.display = "none";
                mode = "SALE";
                clearInput();
            }
        } else if(mode === "CASH") {
            const total = parseFloat(document.getElementById('total-display').innerText);
            const given = parseInt(input) / 100;
            lastChange = given - total;
            finalizeSale();
        } else if(mode === "PRICE") {
            // Hinnanmuutoslogiikka tässä[cite: 2]
            mode = "SALE";
            clearInput();
        }
    }

    function addToCart(p) {
        if(mode !== "SALE") resetToNormal(); // Palautuu normaaliksi jos vaihtoraha oli näkyvissä
        cart.push({...p});
        update();
    }

    function update() {
        const list = document.getElementById('receipt-list');
        list.innerHTML = "";
        let total = 0;
        cart.forEach(item => {
            list.innerHTML += `<div class="receipt-row"><span>1 x ${item.name}</span><span>${item.price.toFixed(2)}</span></div>`;
            total += item.price;
        });
        document.getElementById('total-display').innerText = total.toFixed(2);
    }

    function finalizeSale() {
        // Muutetaan yhteensä-kohta näyttämään vaihtoraha[cite: 1]
        const container = document.getElementById('total-container');
        container.classList.add('change-mode');
        document.getElementById('total-label').innerText = "VAIHTORAHAA";
        document.getElementById('total-display').innerText = lastChange.toFixed(2);
        
        cart = [];
        mode = "SALE_ENDED"; // Odotustila[cite: 1]
        document.getElementById('mode-label').innerText = "KAUPPA VALMIS";
        clearInput();
    }

    function resetToNormal() {
        const container = document.getElementById('total-container');
        container.classList.remove('change-mode');
        document.getElementById('total-label').innerText = "YHTEENSÄ";
        document.getElementById('mode-label').innerText = "MYYNTI";
        mode = "SALE";
        update();
    }

    function lockPOS() {
        mode = "LOGIN";
        document.getElementById('lock-screen').style.display = "flex";
        document.getElementById('seller-info').innerText = "MYYJÄ: EI KIRJAUTUNUT";
        clearInput();
    }

    function openPayMenu() { if(cart.length > 0) document.getElementById('pay-modal').style.display = 'flex'; }
    function setCashMode() { mode = "CASH"; document.getElementById('mode-label').innerText = "ANNETTU SUMMA"; closeModals(); }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    init();
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
</script>
</body>
</html>
