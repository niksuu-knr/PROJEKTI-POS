<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-Rauta POS - Cash Flow Fix</title>
    <style>
        :root {
            --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1;
            --border-color: #888; --danger: #cc0000; --success: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: var(--k-blue); color: white; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; height: 40px; font-weight: bold; }
        .main-container { display: flex; flex: 1; gap: 5px; padding: 5px; height: calc(100vh - 75px); }

        /* Vasen Paneeli */
        .left-panel { width: 380px; display: flex; flex-direction: column; }
        .receipt-area { flex: 1; background: white; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; }
        .receipt-header { background: #444; color: white; padding: 8px; text-align: center; font-weight: bold; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 5px; font-size: 0.9rem; }
        .receipt-row { display: flex; justify-content: space-between; padding: 4px 8px; }
        .receipt-row.selected { background: #fff3e6; outline: 1px solid var(--k-orange); }
        .total-row { display: flex; justify-content: space-between; font-size: 2.2rem; font-weight: bold; color: var(--k-blue); padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; }

        .input-display { background: #1a1a1a; color: #0f0; padding: 10px; text-align: right; font-size: 2rem; font-family: monospace; margin: 5px 0; height: 45px; display: flex; justify-content: space-between; align-items: center; }
        #payment-status-label { font-size: 0.9rem; color: #ff0; }

        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #bbb; padding: 5px; }
        .num-btn { height: 65px; background: #fefefe; border: 1px solid #777; font-size: 1.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num-btn.blue { background: var(--k-blue); color: white; }
        .num-btn.orange { background: var(--k-orange); color: white; }

        /* Keski & Oikea */
        .center-panel { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px; padding-top: 55px; }
        .product-btn { background: white; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; text-align: center; font-weight: bold; cursor: pointer; }
        
        .right-panel { width: 180px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #eee; border: 1px solid #777; font-size: 0.8rem; font-weight: bold; padding-left: 10px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 0.9rem; }
        .f-btn.success { background: var(--success); color: white; }
        .f-btn.success span { color: white; }

        /* Modaalit */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .terminal-box { width: 300px; background: #333; border-radius: 15px; padding: 20px; color: white; text-align: center; }
        .screen { background: #87af87; color: #1a2e1a; height: 100px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<header>
    <div>K-RAUTA POS - MYYMÄLÄ 101</div>
    <div id="clock">19:23:43</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div class="receipt-header">VOIMASSA OLEVA TAPAHTUMA</div>
            <div class="receipt-content" id="receipt-list"></div>
            <div class="total-row"><span>YHTEENSÄ</span> <span id="total-val">0.00</span></div>
        </div>
        <div class="input-display">
            <span id="payment-status-label">MYYNTI</span>
            <span id="pos-input">0</span>
        </div>
        <div class="numpad">
            <div class="num-btn" onclick="press('7')">7</div><div class="num-btn" onclick="press('8')">8</div><div class="num-btn" onclick="press('9')">9</div><div class="num-btn blue">KPL</div>
            <div class="num-btn" onclick="press('4')">4</div><div class="num-btn" onclick="press('5')">5</div><div class="num-btn" onclick="press('6')">6</div><div class="num-btn blue">HAE</div>
            <div class="num-btn" onclick="press('1')">1</div><div class="num-btn" onclick="press('2')">2</div><div class="num-btn" onclick="press('3')">3</div><div class="num-btn orange" onclick="clearInput()">CLR</div>
            <div class="num-btn" onclick="press('0')">0</div><div class="num-btn" onclick="press('00')">00</div><div class="num-btn">,</div><div class="num-btn orange" onclick="handleEnter()">ENT</div>
        </div>
    </div>

    <div class="center-panel" id="product-grid"></div>

    <div class="right-panel">
        <div class="f-btn"><span>F1</span>TUOTEHAKU</div>
        <div class="f-btn"><span>F3</span>K-PLUSSA</div>
        <div class="f-btn" onclick="removeItem()"><span>F6</span>RIVIN POISTO</div>
        <div class="f-btn success" onclick="openPayMenu()"><span>F12</span>MAKSA</div>
    </div>
</div>

<!-- Maksutapavalikko -->
<div id="pay-menu" class="modal">
    <div style="background:white; padding:20px; border:4px solid var(--k-blue); width:350px;">
        <h2 style="text-align:center; color:var(--k-blue);">VALITSE MAKSU</h2>
        <button class="num-btn" style="width:100%; margin-bottom:10px" onclick="setMode('CASH')">F1 - KÄTEINEN</button>
        <button class="num-btn" style="width:100%; margin-bottom:10px" onclick="startCard()">F2 - KORTTI</button>
        <button class="num-btn orange" style="width:100%" onclick="closeModals()">PERUUTA</button>
    </div>
</div>

<!-- Maksupääte-ikkuna -->
<div id="card-modal" class="modal">
    <div class="terminal-box">
        <div class="screen" id="term-screen">ODOTTAA KORTTIA...</div>
        <p id="term-amt">0.00€</p>
    </div>
</div>

<script>
    let cart = [{name: "KESTOPUU 28x95", price: 2.25}, {name: "SEMENTTI S30", price: 8.90}]; // Esimerkkituotteet[cite: 2]
    let input = "";
    let mode = "SALE"; // SALE tai CASH[cite: 2]

    function init() {
        const grid = document.getElementById('product-grid');
        for(let i=0; i<20; i++) {
            const btn = document.createElement('div');
            btn.className = 'product-btn';
            btn.innerHTML = i < 2 ? `${cart[i].name}<br>${cart[i].price}€` : "---";
            grid.appendChild(btn);
        }
        update();
    }

    function press(n) { input += n; document.getElementById('pos-input').innerText = input; }
    function clearInput() { input = ""; document.getElementById('pos-input').innerText = "0"; }

    function update() {
        const list = document.getElementById('receipt-list');
        list.innerHTML = "";
        let total = 0;
        cart.forEach(item => {
            list.innerHTML += `<div class="receipt-row"><span>1 x ${item.name}</span><span>${item.price.toFixed(2)}</span></div>`;
            total += item.price;
        });
        document.getElementById('total-val').innerText = total.toFixed(2);
    }

    function openPayMenu() { document.getElementById('pay-menu').style.display = 'flex'; }
    function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    // Vaihtaa tilan käteismaksulle ja palaa päänäkymään[cite: 2]
    function setMode(newMode) {
        mode = newMode;
        if(mode === 'CASH') {
            document.getElementById('payment-status-label').innerText = "ANNETTU SUMMA";
            document.getElementById('payment-status-label').style.color = "red";
        }
        closeModals();
    }

    function handleEnter() {
        if(mode === 'CASH') {
            const total = parseFloat(document.getElementById('total-val').innerText);
            const given = parseFloat(input) || total;
            alert(`KAUPPA VALMIS\nYhteensä: ${total}€\nAnnettu: ${given}€\nVaihtoraha: ${(given - total).toFixed(2)}€`);
            resetAll();
        } else {
            // Normaali tuotekoodin syöttö[cite: 2]
            clearInput();
        }
    }

    function startCard() {
        closeModals();
        document.getElementById('card-modal').style.display = 'flex';
        document.getElementById('term-amt').innerText = document.getElementById('total-val').innerText + "€";
        
        setTimeout(() => {
            if(Math.random() > 0.3) {
                document.getElementById('term-screen').innerText = "HYVÄKSYTTY";
                document.getElementById('term-screen').style.background = "#28a745";
                setTimeout(() => resetAll(), 1500);
            } else {
                document.getElementById('term-screen').innerText = "VIRHE - KOKEILE UUDELLEEN";
                document.getElementById('term-screen').style.background = "#cc0000";
                setTimeout(() => startCard(), 2000);
            }
        }, 2000);
    }

    function resetAll() {
        cart = []; update(); mode = "SALE";
        document.getElementById('payment-status-label').innerText = "MYYNTI";
        document.getElementById('payment-status-label').style.color = "#ff0";
        closeModals(); clearInput();
    }

    init();
</script>
</body>
</html>
