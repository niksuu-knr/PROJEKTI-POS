<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-RAUTA POS v37.5 - QUICK MEMBER</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --bg-grey: #d1d1d1; --danger: #cc0000; --success: #28a745; --terminal-green: #0f0; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-grey); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { background: var(--k-blue); color: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 4px solid var(--k-orange); flex-shrink: 0; }
        .main-container { display: flex; flex: 1; gap: 8px; padding: 8px; height: calc(100vh - 68px); overflow: hidden; }
        
        /* Vasen: Kuitti ja Syöttö */
        .left-panel { width: 450px; display: flex; flex-direction: column; gap: 8px; }
        .receipt-area { flex: 1; background: white; border: 2px solid #666; display: flex; flex-direction: column; overflow: hidden; }
        .receipt-content { flex: 1; overflow-y: auto; font-family: 'Consolas', monospace; padding: 10px; }
        .receipt-row { padding: 6px 5px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer; }
        .receipt-row.selected { background: #e3f2fd; border-left: 5px solid var(--k-blue); }
        .receipt-row.voided { text-decoration: line-through; color: #999; font-style: italic; background: #f9f9f9; }

        .total-container { background: #eee; border-top: 3px solid #999; padding: 10px; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.8rem; font-weight: bold; color: var(--k-blue); }
        .input-display { background: #000; color: var(--terminal-green); padding: 10px; text-align: right; font-size: 2.5rem; font-family: 'Courier New'; border: 4px inset #444; }

        /* Keskellä: Tuotteet */
        .center-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .product-display { flex: 1; background: #bbb; border: 2px solid #888; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); grid-auto-rows: 90px; gap: 8px; overflow-y: auto; }
        .grid-item { background: white; border: 1px solid #666; border-bottom: 4px solid var(--k-blue); font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5px; font-size: 0.8rem; }
        .category-bar { height: 55px; display: flex; gap: 5px; padding: 5px; background: #888; overflow-x: auto; }
        .cat-btn { background: var(--k-blue); color: white; border: none; padding: 0 15px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--k-orange); }

        /* Oikealla: Toiminnot */
        .right-panel { width: 150px; display: grid; grid-template-rows: repeat(12, 1fr); gap: 4px; }
        .f-btn { background: #fdfdfd; border: 2px solid #777; font-size: 0.7rem; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .f-btn span { color: var(--k-blue); font-size: 1rem; }

        /* Modaalit */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; }
        .modal-content { background: #eee; width: 90%; height: 85%; border: 8px solid var(--k-blue); display: flex; flex-direction: column; }
        .admin-nav { background: #333; display: flex; padding: 10px; gap: 5px; }
        .admin-nav button { padding: 12px 20px; cursor: pointer; border: none; font-weight: bold; background: #555; color: white; }
        .admin-nav button.active { background: var(--k-orange); }
        .admin-body { flex: 1; padding: 20px; overflow-y: auto; background: white; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    </style>
</head>
<body onload="init()">

<header>
    <div style="font-weight: 900; font-size: 1.4rem;">K-RAUTA POS v37.5</div>
    <div id="status-bar">MYYJÄ: 101 - ADMIN | <span id="current-member-name">EI JÄSENTÄ</span></div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="left-panel">
        <div class="receipt-area">
            <div id="receipt-list" class="receipt-content"></div>
            <div class="total-container">
                <div class="total-row"><span>YHTEENSÄ</span><span id="total-val">0.00</span></div>
            </div>
        </div>
        <div id="display" class="input-display">0.00</div>
        <div id="numpad" style="display:grid; grid-template-columns:repeat(4,1fr); gap:2px;"></div>
    </div>

    <div class="center-panel">
        <div id="products" class="product-display"></div>
        <div id="categories" class="category-bar"></div>
    </div>

    <div class="right-panel">
        <div class="f-btn" onclick="location.reload()"><span>F1</span>ULOS</div>
        <div class="f-btn" onclick="openAdmin('PRODUCTS')"><span>F2</span>HALLINTA</div>
        <div class="f-btn" onclick="handleF('F3')"><span>F3</span>HAE JÄSEN</div>
        <div class="f-btn" onclick="handleF('F4')"><span>F4</span>LAHJAK. MYYNTI</div>
        <div class="f-btn" onclick="handleF('F6')"><span>F6</span>POISTA RIVI</div>
        <div class="f-btn" onclick="handleF('F7')"><span>F7</span>PALAUTUS</div>
        <div class="f-btn" style="background: #fff3e0;" onclick="handleF('F9')"><span>F9</span>JÄSEN LISÄYS</div>
        <div class="f-btn" onclick="handleF('F11')"><span>F11</span>MITÄTÖI</div>
        <div class="f-btn" style="background:var(--success); color:white;" onclick="handleF('F12')"><span>F12</span>MAKSA</div>
    </div>
</div>

<!-- Hallinta/Pikalisäys-ikkuna -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div id="admin-menu" class="admin-nav">
            <button id="btn-P" onclick="openAdmin('PRODUCTS')">TUOTTEET</button>
            <button id="btn-C" onclick="openAdmin('CATEGORIES')">KATEGORIAT</button>
            <button id="btn-S" onclick="openAdmin('SELLERS')">MYYJÄT</button>
            <button id="btn-M" onclick="openAdmin('MEMBERS')">JÄSENET</button>
            <button id="btn-R" onclick="openAdmin('REPORTS')">RAPORTIT</button>
            <button style="margin-left:auto; background:var(--danger);" onclick="closeModal()">SULJE (ESC)</button>
        </div>
        <div id="admin-body" class="admin-body"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('pos_v37_5_db')) || {
        products: [{id: "03199337", name: "NAULAIN MAKITA", price: 299.00, cat: "KONEET"}],
        categories: ["KONEET", "TYÖKALUT", "RAKENNUS"],
        sellers: [{id: "101", name: "Admin"}],
        members: [{id: "777", name: "Matti Meikäläinen"}],
        history: []
    };

    let cart = [], input = "", currentCat = "KONEET", selectedIdx = -1, activeMember = null;

    function save() { localStorage.setItem('pos_v37_5_db', JSON.stringify(db)); }

    function init() {
        renderProducts(); renderCategories(); renderNumpad();
        window.addEventListener('keydown', (e) => {
            if(e.key.startsWith('F')) { e.preventDefault(); handleF(e.key); }
            if(e.key === 'Escape') closeModal();
            if(!isNaN(e.key)) { input += e.key; updateDisplay(); }
        });
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI'); }, 1000);
    }

    function handleF(key) {
        if (key === 'F2') openAdmin('PRODUCTS');
        if (key === 'F3') searchMember();
        if (key === 'F4') sellGiftCard();
        if (key === 'F6') voidRow();
        if (key === 'F7') returnSale();
        if (key === 'F9') quickMemberAdd(); // UUSI TOIMINTO
        if (key === 'F11') { if(confirm("Mitätöidäänkö kuitti?")) { cart = []; activeMember = null; updateReceipt(); } }
        if (key === 'F12') openPayment();
    }

    // --- JÄSENHALLINTA ---
    function quickMemberAdd() {
        document.getElementById('admin-menu').style.display = "none";
        document.getElementById('admin-body').innerHTML = `
            <div style="max-width:400px; margin:auto; text-align:center;">
                <h2>PIKALISÄYS: UUSI JÄSEN</h2>
                <input id="q-id" placeholder="Puhelinnumero / ID" style="width:100%; padding:15px; margin:10px 0; font-size:1.2rem;">
                <input id="q-name" placeholder="Asiakkaan nimi" style="width:100%; padding:15px; margin:10px 0; font-size:1.2rem;">
                <button onclick="saveQuickMember()" style="width:100%; padding:20px; background:var(--success); color:white; font-weight:bold; border:none; cursor:pointer;">TALLENNA JA VALITSE</button>
                <button onclick="closeModal()" style="margin-top:20px; border:none; background:none; color:grey; cursor:pointer;">Peruuta</button>
            </div>
        `;
        document.getElementById('modal').style.display = "flex";
        setTimeout(() => document.getElementById('q-id').focus(), 100);
    }

    function saveQuickMember() {
        let id = document.getElementById('q-id').value;
        let name = document.getElementById('q-name').value;
        if(id && name) {
            let newMember = {id: id, name: name};
            db.members.push(newMember);
            save();
            activeMember = newMember;
            document.getElementById('current-member-name').innerText = "JÄSEN: " + name;
            closeModal();
            alert("Jäsen tallennettu ja liitetty kuitille.");
        } else { alert("Täytä molemmat kentät!"); }
    }

    function searchMember() {
        let id = prompt("Syötä Jäsen-ID tai puh.nro:");
        let m = db.members.find(x => x.id === id);
        if(m) { 
            activeMember = m; 
            document.getElementById('current-member-name').innerText = "JÄSEN: " + m.name;
        } else { alert("Ei löytynyt!"); }
    }

    // --- MYYNTI JA POISTO ---
    function voidRow() {
        if (selectedIdx > -1) {
            cart[selectedIdx].voided = !cart[selectedIdx].voided;
            selectedIdx = -1;
            updateReceipt();
        } else { alert("Valitse ensin rivi kuitilta klikkaamalla!"); }
    }

    function sellGiftCard() {
        let a = parseFloat(input);
        if(a > 0) {
            cart.push({id:"GIFT", name:"LAHJAKORTTI", price:a, voided:false});
            input = ""; updateDisplay(); updateReceipt();
        } else { alert("Syötä summa näppäimistöllä ensin!"); }
    }

    // --- HALLINTAPANEELI (F2) ---
    function openAdmin(tab) {
        document.getElementById('admin-menu').style.display = "flex";
        document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + tab[0]);
        if(btn) btn.classList.add('active');
        
        let html = `<h2>${tab}</h2>`;
        const body = document.getElementById('admin-body');

        if (tab === 'PRODUCTS') {
            html += `<div><input id="p-n" placeholder="Nimi"> <input id="p-p" placeholder="Hinta"> <select id="p-c">${db.categories.map(c=>`<option>${c}</option>`).join('')}</select> <button onclick="addP()">LISÄÄ</button></div>
                     <table><tr><th>ID</th><th>Nimi</th><th>Hinta</th><th>Kategoria</th></tr>${db.products.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.price.toFixed(2)}€</td><td>${p.cat}</td></tr>`).join('')}</table>`;
        } else if (tab === 'CATEGORIES') {
            html += `<div><input id="c-n" placeholder="Uusi kategoria"> <button onclick="addC()">LISÄÄ</button></div>
                     <ul>${db.categories.map(c=>`<li>${c} <button onclick="db.categories=db.categories.filter(x=>x!=='${c}');save();openAdmin('CATEGORIES');renderCategories();">X</button></li>`).join('')}</ul>`;
        } else if (tab === 'MEMBERS') {
            html += `<table><tr><th>ID</th><th>Nimi</th></tr>${db.members.map(m=>`<tr><td>${m.id}</td><td>${m.name}</td></tr>`).join('')}</table>`;
        } else if (tab === 'REPORTS') {
            let rev = db.history.reduce((a,b)=>a+b.total, 0);
            html += `<h3>Kokonaisvaihto: ${rev.toFixed(2)} €</h3><button onclick="if(confirm('Nollataanko?')){db.history=[];save();openAdmin('REPORTS');}">TYHJENNÄ HISTORIA (Z)</button>
                     <table><tr><th>Pvm</th><th>Summa</th><th>Tapa</th></tr>${db.history.map(h=>`<tr><td>${h.date}</td><td>${h.total.toFixed(2)}€</td><td>${h.method}</td></tr>`).join('')}</table>`;
        }
        body.innerHTML = html;
        document.getElementById('modal').style.display = "flex";
    }

    function addP() { let n=document.getElementById('p-n').value, p=parseFloat(document.getElementById('p-p').value), c=document.getElementById('p-c').value; if(n&&p){db.products.push({id:Date.now().toString().slice(-6), name:n, price:p, cat:c}); save(); openAdmin('PRODUCTS'); renderProducts();} }
    function addC() { let n=document.getElementById('c-n').value; if(n){db.categories.push(n); save(); openAdmin('CATEGORIES'); renderCategories();} }

    // --- MAKSU JA APU ---
    function openPayment() {
        let t = cart.reduce((a,b)=>a+(b.voided?0:b.price),0);
        document.getElementById('admin-menu').style.display = "none";
        document.getElementById('admin-body').innerHTML = `
            <div style="text-align:center;">
                <h1>MAKSETAAN: ${t.toFixed(2)} €</h1>
                <button class="f-btn" style="width:200px; height:80px; margin:10px;" onclick="finalize('KÄTEINEN')">KÄTEINEN</button>
                <button class="f-btn" style="width:200px; height:80px; margin:10px;" onclick="finalize('KORTTI')">KORTTI</button>
            </div>`;
        document.getElementById('modal').style.display = "flex";
    }

    function finalize(m) {
        let t = cart.reduce((a,b)=>a+(b.voided?0:b.price),0);
        db.history.push({id: Date.now(), date: new Date().toLocaleString(), total: t, items: [...cart], method: m, member: activeMember});
        save(); cart = []; activeMember = null; updateReceipt(); closeModal(); alert("Maksu suoritettu!");
    }

    function renderProducts() { document.getElementById('products').innerHTML = db.products.filter(p=>p.cat===currentCat).map(p=>`<div class="grid-item" onclick='cart.push({...${JSON.stringify(p)}, voided:false});updateReceipt();'>${p.name}<br>${p.price.toFixed(2)}€</div>`).join(''); }
    function renderCategories() { document.getElementById('categories').innerHTML = db.categories.map(c=>`<button class="cat-btn ${currentCat===c?'active':''}" onclick="currentCat='${c}';renderCategories();renderProducts();">${c}</button>`).join(''); }
    function updateReceipt() {
        let t = cart.reduce((a,b)=>a+(b.voided?0:b.price),0);
        document.getElementById('receipt-list').innerHTML = cart.map((item, i) => `<div class="receipt-row ${selectedIdx===i?'selected':''} ${item.voided?'voided':''}" onclick="selectedIdx=${i};updateReceipt();"><span>${item.name}</span><span>${item.voided?'0.00':item.price.toFixed(2)}€</span></div>`).join('');
        document.getElementById('total-val').innerText = t.toFixed(2);
        document.getElementById('current-member-name').innerText = activeMember ? "JÄSEN: " + activeMember.name : "EI JÄSENTÄ";
    }
    function renderNumpad() { document.getElementById('numpad').innerHTML = ['7','8','9','C','4','5','6','-','1','2','3','+','0',',','.','ENT'].map(k=>`<button class="f-btn" style="height:50px" onclick="btnP('${k}')">${k}</button>`).join(''); }
    function btnP(k) { if(k==='C') input=""; else if(k==='ENT') { let p=db.products.find(x=>x.id===input); if(p) {cart.push({...p, voided:false}); updateReceipt(); input="";} } else input+=k; updateDisplay(); }
    function updateDisplay() { document.getElementById('display').innerText = input || "0.00"; }
    function closeModal() { document.getElementById('modal').style.display = "none"; }
</script>
</body>
</html>
