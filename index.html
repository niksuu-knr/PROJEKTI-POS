<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-Rauta</title>
    <style>
        :root { --k-orange: #ff6600; --k-blue: #004593; --k-grey: #f2f2f2; }
        body { font-family: 'Arial', sans-serif; margin: 0; display: grid; grid-template-rows: auto 1fr auto; height: 100vh; background: var(--k-grey); }

        /* Yläpalkki */
        header { background: white; border-bottom: 3px solid var(--k-orange); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .plussa-box { background: var(--k-blue); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; }

        /* Keskiosa */
        main { display: grid; grid-template-columns: 250px 1fr 350px; overflow: hidden; }

        /* Sivupalkki (Osastot) */
        .sidebar { background: #fff; padding: 10px; border-right: 1px solid #ddd; }
        .dept-btn { width: 100%; padding: 12px; margin-bottom: 5px; text-align: left; background: #fff; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .dept-btn:hover { background: var(--k-orange); color: white; border-color: var(--k-orange); }

        /* Tuote-alue */
        .product-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; overflow-y: auto; }
        .product-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 4px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .price-tag { color: var(--k-orange); font-size: 1.2rem; font-weight: bold; }
        .alv-info { font-size: 0.8rem; color: #666; }

        /* Kuittiosio */
        .cart-section { background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
        .cart-header { background: #444; color: white; padding: 10px; text-align: center; }
        .cart-items { flex-grow: 1; padding: 10px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.9rem; }
        .total-box { padding: 20px; background: #eee; border-top: 2px solid var(--k-orange); }

        /* Alapalkki */
        footer { background: white; border-top: 1px solid #ddd; padding: 10px; display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 15px 30px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-pay { background: var(--k-orange); color: white; }
        .btn-pro { background: var(--k-blue); color: white; }
    </style>
</head>
<body>

<header>
    <div style="color: var(--k-blue); font-size: 1.8rem; font-weight: 900;">K-RAUTA</div>
    <div class="plussa-box">K-PLUSSA: Tunnistettu (1234...)</div>
</header>

<main>
    <div class="sidebar">
        <button class="dept-btn">RAKENNEMATERIAALIT</button>
        <button class="dept-btn">SÄHKÖ JA VALAISTUS</button>
        <button class="dept-btn">TYÖKALUT</button>
        <button class="dept-btn">PIHA JA PUUTARHA</button>
        <button class="dept-btn">SISUSTUS</button>
    </div>

    <div class="product-grid">
        <div class="product-card" onclick="addToCart('Kestopuu 28x95', 2.45)">
            <strong>Kestopuu 28x95</strong><br>
            <span class="price-tag">2,45 € / m</span><br>
            <span class="alv-info">(sis. ALV 24%)</span>
        </div>
        <div class="product-card" onclick="addToCart('FXA Akkuporakone', 89.00)">
            <strong>FXA Akkuporakone</strong><br>
            <span class="price-tag">89,00 €</span><br>
            <span class="alv-info">(sis. ALV 24%)</span>
        </div>
        <div class="product-card" onclick="addToCart('Sini-Maali 10L', 125.00)">
            <strong>Sini-Maali 10L</strong><br>
            <span class="price-tag">125,00 €</span><br>
            <span class="alv-info">(sis. ALV 24%)</span>
        </div>
    </div>

    <div class="cart-section">
        <div class="cart-header">MYYNTITAPAHTUMA</div>
        <div class="cart-items" id="cart-items">
            <!-- Tuotteet tulevat tähän -->
        </div>
        <div class="total-box">
            <div style="display: flex; justify-content: space-between;">
                <span>ALV 0%</span> <span id="tax-free">0.00</span>€
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; margin-top: 10px;">
                <span>YHTEENSÄ</span> <span id="total-price">0.00</span>€
            </div>
        </div>
    </div>
</main>

<footer>
    <button class="btn btn-pro">LASKUTA TILIÄ</button>
    <button class="btn" style="background: #ddd;">KESKEYTÄ</button>
    <button class="btn btn-pay">MAKSA KORTILLA</button>
</footer>

<script>
    let total = 0;
    function addToCart(name, price) {
        const cart = document.getElementById('cart-items');
        const item = document.createElement('div');
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.style.marginBottom = '8px';
        item.innerHTML = `<span>${name}</span> <span>${price.toFixed(2)}€</span>`;
        cart.appendChild(item);

        total += price;
        updateTotals();
    }

    function updateTotals() {
        document.getElementById('total-price').innerText = total.toFixed(2);
        // Lasketaan alv-ton hinta (esimerkkinä 24%)
        const taxFree = total / 1.24;
        document.getElementById('tax-free').innerText = taxFree.toFixed(2);
    }
</script>

</body>
</html>
