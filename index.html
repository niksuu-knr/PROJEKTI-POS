<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>K-Rauta Professional POS</title>
    <style>
        :root {
            --k-orange: #ff6600;
            --k-blue: #004593;
            --action-grey: #e0e0e0;
            --danger: #d9534f;
            --success: #5cb85c;
            --warning: #f0ad4e;
        }

        body {
            font-family: 'Segoe UI', Helvetica, sans-serif;
            margin: 0;
            display: grid;
            grid-template-rows: 50px 1fr 40px;
            height: 100vh;
            background: #ccc;
            overflow: hidden;
        }

        /* Yläpalkki */
        header {
            background: var(--k-blue);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
        }

        /* Pääalue */
        main {
            display: grid;
            grid-template-columns: 350px 1fr 220px; /* Kuitti | Tuotteet | Toiminnot */
            gap: 5px;
            padding: 5px;
        }

        /* KUITTIALUE (Vasen) */
        .receipt-container {
            background: white;
            display: flex;
            flex-direction: column;
            border: 1px solid #999;
        }
        .receipt-list {
            flex-grow: 1;
            padding: 5px;
            font-family: 'Courier New', monospace;
            overflow-y: auto;
            background: #fff;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted #ccc;
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .totals-area {
            background: #eee;
            padding: 10px;
            border-top: 2px solid var(--k-blue);
        }

        /* TUOTERUUDUKKO (Keskellä) */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
        }
        .product-btn {
            background: #fff;
            border: 1px solid #999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            padding: 5px;
        }
        .product-btn:active { background: var(--k-orange); color: white; }
        .product-btn.folder { background: #f9f9f9; border-bottom: 4px solid var(--k-blue); }

        /* TOIMINTONÄPPÄIMISTÖ (Oikea laita) */
        .action-grid {
            display: grid;
            grid-template-rows: repeat(10, 1fr);
            gap: 5px;
        }
        .action-btn {
            background: var(--action-grey);
            border: 1px solid #888;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .btn-plussa { background: var(--k-blue); color: white; }
        .btn-pay { background: var(--success); color: white; font-size: 1rem; }
        .btn-cancel { background: var(--danger); color: white; }
        .btn-subtotal { background: var(--warning); color: black; }

        /* Alapalkki */
        footer {
            background: #444;
            color: #ddd;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 0.8rem;
            gap: 20px;
        }
    </style>
</head>
<body>

<header>
    <div>K-RAUTA POS v4.2</div>
    <div>MYYJÄ: 123 - Antti A.</div>
    <div id="clock">12:45:01</div>
</header>

<main>
    <!-- Vasen: Kuitti -->
    <div class="receipt-container">
        <div style="background: #ddd; padding: 5px; font-weight: bold; text-align: center;">MYYNTITAPAHTUMA</div>
        <div class="receipt-list" id="receipt-list">
            <!-- Tuotteet listataan tässä -->
        </div>
        <div class="totals-area">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                <span>ALV 0%</span> <span id="tax-free">0.00</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 1.6rem; font-weight: bold; color: var(--k-blue);">
                <span>YHTEENSÄ</span> <span id="total">0.00</span>
            </div>
        </div>
    </div>

    <!-- Keskellä: Tuoteruudukko -->
    <div class="product-grid">
        <!-- Kansiot ylhäällä -->
        <button class="product-btn folder">PUUTAVARA</button>
        <button class="product-btn folder">RUUVIT / KIINNITYS</button>
        <button class="product-btn folder">MAALIT</button>
        <button class="product-btn folder">PUUTARHA</button>
        
        <!-- Pika-artikkelit -->
        <button class="product-btn" onclick="add('Sementti 25kg', 8.50)">SEMENTTI S30<br>8.50€</button>
        <button class="product-btn" onclick="add('Kestopuu 28x95', 2.10)">KESTOPUU m<br>2.10€</button>
        <button class="product-btn" onclick="add('Lapiot / Työkalut', 24.90)">YLEISLAPIO<br>24.90€</button>
        <button class="product-btn" onclick="add('Toimitusmaksu', 45.00)">RAHTI / KULJETUS<br>45.00€</button>
        
        <!-- Tyhjiä paikkoja -->
        <div class="product-btn" style="border: 1px dashed #ccc; opacity: 0.5;">EI MÄÄRITETTY</div>
        <div class="product-btn" style="border: 1px dashed #ccc; opacity: 0.5;">EI MÄÄRITETTY</div>
        <div class="product-btn" style="border: 1px dashed #ccc; opacity: 0.5;">EI MÄÄRITETTY</div>
        <div class="product-btn" style="border: 1px dashed #ccc; opacity: 0.5;">EI MÄÄRITETTY</div>
    </div>

    <!-- Oikea: Toimintonäppäimet -->
    <div class="action-grid">
        <button class="action-btn btn-plussa">F1 PLU-HAKU</button>
        <button class="action-btn">F2 KANTA-ASIAKAS</button>
        <button class="action-btn">F3 TILIASIAKAS</button>
        <button class="action-btn">F4 MUUTA MÄÄRÄÄ</button>
        <button class="action-btn">F5 ALENNUS %</button>
        <button class="action-btn">F6 HINNAN MUUTOS</button>
        <button class="action-btn btn-subtotal">F7 VÄLISUMMA</button>
        <button class="action-btn">F8 AVAA LAATIKKO</button>
        <button class="action-btn btn-cancel">F9 PERUUTA</button>
        <button class="action-btn btn-pay">F12 MAKSA</button>
    </div>
</main>

<footer>
    <span>KONE: TERMINAL-04</span>
    <span>VARASTO: 001 (PÄÄVARASTO)</span>
    <span>STATUS: KIRJAUTUNUT</span>
</footer>

<script>
    let total = 0;

    function add(name, price) {
        const list = document.getElementById('receipt-list');
        const row = document.createElement('div');
        row.className = 'receipt-row';
        row.innerHTML = `<span>1 x ${name}</span> <span>${price.toFixed(2)}</span>`;
        list.appendChild(row);
        list.scrollTop = list.scrollHeight; // Automaattinen rullaus alas

        total += price;
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById('total').innerText = total.toFixed(2) + " €";
        document.getElementById('tax-free').innerText = (total / 1.24).toFixed(2);
    }

    // Kellon päivitys
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI');
    }, 1000);
</script>

</body>
</html>
