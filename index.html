<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Motonet POS Interface</title>
    <style>
        :root { --motonet-red: #ed1c24; --bg-dark: #1a1a1a; --text-grey: #333; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: grid; grid-template-rows: 70px 1fr 100px; height: 100vh; background: #eee; }

        /* Yläpalkki - Rekisterinumerohaku & Kanta-asiakas */
        header { background: var(--motonet-red); color: white; display: flex; align-items: center; padding: 0 20px; gap: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
        .reg-input { text-transform: uppercase; font-weight: bold; font-size: 1.5rem; width: 150px; text-align: center; border: 2px solid #000; border-radius: 5px; }
        .search-bar { flex-grow: 1; padding: 12px; border: none; border-radius: 4px; font-size: 1.1rem; }

        /* Keskiosa */
        main { display: grid; grid-template-columns: 280px 1fr 400px; overflow: hidden; gap: 10px; padding: 10px; }
        
        /* Varaosakategoriat */
        .category-menu { background: #fff; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
        .cat-btn { background: #f8f8f8; border: 1px solid #ddd; padding: 15px; text-align: left; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .cat-btn:hover { background: var(--bg-dark); color: white; }

        /* Tuote-alue */
        .product-list { background: #fff; border-radius: 8px; padding: 15px; overflow-y: auto; }
        .part-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; transition: 0.2s; cursor: pointer; }
        .part-row:hover { background: #fff5f5; }
        .stock-tag { font-size: 0.8rem; color: green; font-weight: bold; }

        /* Ostoskori / Lasku */
        .billing { background: #fff; border-radius: 8px; display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.05); }
        .customer-info { background: #333; color: white; padding: 15px; font-size: 0.9rem; }
        .items-area { flex-grow: 1; padding: 15px; font-family: 'Consolas', monospace; }
        .total-section { padding: 20px; border-top: 3px solid var(--motonet-red); font-size: 1.8rem; font-weight: bold; text-align: right; }

        /* Alapalkki */
        footer { background: white; padding: 15px 25px; display: flex; gap: 15px; justify-content: flex-end; align-items: center; border-top: 1px solid #ccc; }
        .btn { padding: 18px 35px; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-cancel { background: #ddd; }
        .btn-pay { background: var(--motonet-red); color: white; font-size: 1.2rem; box-shadow: 0 4px 0 #b31217; }
        .btn-pay:active { transform: translateY(2px); box-shadow: 0 2px 0 #b31217; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 1.6rem; letter-spacing: -1px;">MOTONET</div>
    <input type="text" class="reg-input" placeholder="ABC-123" maxlength="7">
    <input type="text" class="search-bar" placeholder="Hae varaosaa, tuotenumeroa tai kategoriaa...">
</header>

<main>
    <div class="category-menu">
        <div style="font-weight: bold; color: var(--motonet-red); margin-bottom: 10px;">VARAOSAT</div>
        <button class="cat-btn">MOOTTORI</button>
        <button class="cat-btn">JARRUT</button>
        <button class="cat-btn">ALUSTA JA OHJAUS</button>
        <button class="cat-btn">SÄHKÖOSAT</button>
        <button class="cat-btn">SUODATTIMET</button>
    </div>

    <div class="product-list">
        <h3>Hakutulokset / Suosikit</h3>
        <div class="part-row" onclick="add('Öljynsuodatin (Bosch)', 12.90)">
            <div><strong>15-1234</strong><br>Öljynsuodatin (Bosch)</div>
            <div style="text-align: right;">
                <span class="stock-tag">Hyllyssä (12 kpl)</span><br><strong>12,90 €</strong>
            </div>
        </div>
        <div class="part-row" onclick="add('Moottoriöljy 5W-30 5L', 49.90)">
            <div><strong>59-0010</strong><br>Motonet Full Synthetic 5L</div>
            <div style="text-align: right;">
                <span class="stock-tag">Hyllyssä (45 kpl)</span><br><strong>49,90 €</strong>
            </div>
        </div>
        <div class="part-row" onclick="add('Sulkasarja (Bosch Aerotwin)', 34.50)">
            <div><strong>12-5560</strong><br>Sulkasarja A556S</div>
            <div style="text-align: right;">
                <span class="stock-tag">Hyllyssä (4 kpl)</span><br><strong>34,50 €</strong>
            </div>
        </div>
    </div>

    <div class="billing">
        <div class="customer-info">
            KANTA-ASIAKAS: <strong>Matti Meikäläinen</strong><br>
            Pisteet: 450 | Sähköinen kuitti: KYLLÄ
        </div>
        <div class="items-area" id="items">
            <!-- Tuoterivit -->
        </div>
        <div class="total-section">
            <span style="font-size: 1rem; color: #666;">YHTEENSÄ</span><br>
            <span id="total">0.00</span> €
        </div>
    </div>
</main>

<footer>
    <button class="btn btn-cancel">TYHJENNÄ</button>
    <button class="btn" style="background: #333; color: white;">PERÄKÄRRYN VUOKRAUS</button>
    <button class="btn btn-pay">MAKSU / F12</button>
</footer>

<script>
    let total = 0;
    function add(name, price) {
        const list = document.getElementById('items');
        const item = document.createElement('div');
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.style.padding = '5px 0';
        item.innerHTML = `<span>${name}</span> <span>${price.toFixed(2)}</span>`;
        list.appendChild(item);

        total += price;
        document.getElementById('total').innerText = total.toFixed(2);
    }
</script>

</body>
</html>
